kinotic:
  # A lightweight gateway for the @kinotic-ai/core RPC tests — domain/persistence/os-api/github
  # are all off, so TestSecurityService handles STOMP auth and no Elasticsearch is required.
  # The orchestrator and system-api go off with them: their repositories extend the domain
  # AbstractRepository, which needs CrudServiceTemplate.
  disableDomain: true
  disableOrchestrator: true
  disableOsApi: true
  disablePersistence: true
  disableGithub: true
  disableSystemApi: true