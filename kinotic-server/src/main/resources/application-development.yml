# YAML Reference http://www.yaml.org/refcard.html
kinotic:
  debug: true
  github:
    webhookSecret: "-"
    appPrivateKey: "-"
  domain:
    # IDE dev runs the SPA on vite (5173); kinotic-server is just the backend on 58503.
    # appBaseUrl builds SPA links (verification emails, post-auth redirects) — the SPA's
    # origin. apiBaseUrl builds the OAuth2/OIDC redirect_uris, which must land on the
    # backend: the vite server has no /api proxy, so an IdP callback sent to 5173
    # dead-ends in the SPA router. IdP callback URLs are registered against apiBaseUrl.
    appBaseUrl: http://localhost:5173
    apiBaseUrl: http://localhost:58503
    email:
      # No real ACS in dev — EmailService logs verification URLs instead of sending.
      # To test against real ACS, flip enabled=true (endpoint/sender are pre-filled).
      enabled: true
      endpoint: https://acs-kinotic.communication.azure.com
      sender-address: "DoNotReply@kinotic.ai"
    elastic-connections:
      - scheme: "http"
        host: "localhost"
        port: "9200"
    secretStorage:
      backend: ~
      # Base64-encoded 32-byte key used by SecretNameDeriver to derive opaque, deterministic
      # storage names. Dev-only value — production supplies this via Azure Key Vault.
      masterKey: 0qWH2oHEp27LLD7iBHEiABqJFf1q5GRYK6OdMc5Wdv4=
  apiGateway:
    cors:
      allowedOriginPattern: "http:\\/\\/localhost:\\d+"
      allowCredentials: true
  maxNumberOfCoresToUse: 4
  ignite:
    discoveryType: SHAREDFS
  platformSecrets:
    # Auto-seeded on first boot by DevPlatformSecretsGenerator (dev profile only). Each
    # developer machine ends up with its own random keys; none of this is committed.
    # Production uses Azure Key Vault via the Secrets Store CSI driver — same file layout,
    # different origin.
    jwtSigningKeysPath: ${user.home}/.kinotic/dev-platform-secrets/jwt-signing-keys
  # OIDC client secrets resolve via SecretReferenceResolver — Azure Key Vault when
  # kinotic.domain.secretStorage.azure.vaultUrl is set, otherwise from KINOTIC_AKV_<name> env vars
  # (uppercased, non-alphanumerics → "_"). For local dev, export the env var matching the
  # secret name on the seeded OrgSignupOidcConfiguration / OidcConfiguration row.

logging:
  level:
    org:
      kinotic: TRACE

spring:
  ai:
    openai:
      api-key: "noop"
      base-url: https://api.x.ai
      chat:
        options:
          model: grok-4

