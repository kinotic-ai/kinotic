# YAML Reference http://www.yaml.org/refcard.html
kinotic:
  debug: true
  traceLog:
    excludes:
      - "srv://system-api~org.kinotic.system.api.services.VmNodeOrchestrationService/heartbeat"
      - "srv://system-api~org.kinotic.system.api.services.VmNodeOrchestrationService/reportWorkloadStatus"
  persistence:
    # A single-node dev cluster cannot assign replicas, and every published EntityDefinition costs
    # numberOfShards * (1 + numberOfReplicas) against the 1000-shard default. 1/0 keeps the cluster
    # green and lets a developer publish far more definitions before hitting the cap.
    numberOfShards: 1
    numberOfReplicas: 0
  managementApi:
    github:
      webhookSecret: "-"
      appPrivateKey: "-"
    # UIs publish to a local Azurite (docker run -p 10000:10000 mcr.microsoft.com/azure-storage/azurite)
    # standing in for every organization's storage account
    organizationStorage:
      disableProvisioner: true
      azuriteConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
  systemApi:
    deployment:
      # A workload runs inside a micro VM, so "localhost" there is the guest, not this machine.
      # Local development runs the BOXLITE provider, whose guests reach the host on the
      # gvisor-tap-vsock host alias; boxlite's proxy completes the last hop over this machine's
      # loopback, so the gateway needs no exposure beyond it.
      #
      # A CLOUD_HYPERVISOR node instead puts its workloads on the node's docker bridge, where
      # they reach the gateway at 172.17.0.1.
      serverHost: 192.168.127.254
      # The sync workload fetches the project from GitHub and runs bun install
      syncAllowedHosts:
        - github.com
        - registry.npmjs.org
  domain:
    # One-origin tunnel dev: the ngrok tunnel fronts the vite dev server (pnpm dev:tunnel, or
    # pnpm dev:tunnel:build for a production build over a slow upstream),
    # whose proxy forwards /api, /v1 (WebSocket), /.well-known, and /mcp to 58503. With
    # appBaseUrl on the tunnel origin, apiBaseUrl and oauth.issuerBaseUrl fall back to it,
    # so SPA links, OIDC/OAuth redirect_uris, GitHub callbacks, and the MCP surface all
    # share the one origin. For plain localhost dev (pnpm dev, no tunnel) use instead:
    #   appBaseUrl: http://localhost:5173
    #   apiBaseUrl: http://localhost:58503
    appBaseUrl: https://platinum-protector-thesis.ngrok-free.dev
    email:
      # No real ACS in dev — EmailService logs verification URLs instead of sending.
      # To test against real ACS, flip enabled=true (endpoint/sender are pre-filled).
      enabled: true
      endpoint: https://acs-kinotic.communication.azure.com
      sender-address: "DoNotReply@kinotic.ai"
    elastic-connections:
      - scheme: "http"
        host: "localhost"
        port: "9200"
    secretStorage:
      backend: ~
      # Base64-encoded 32-byte key used by SecretNameDeriver to derive opaque, deterministic
      # storage names. Dev-only value — production supplies this via Azure Key Vault.
      masterKey: 0qWH2oHEp27LLD7iBHEiABqJFf1q5GRYK6OdMc5Wdv4=
  apiGateway:
    cors:
      # Covers both ways dev runs: localhost (pnpm dev) and an ngrok tunnel (pnpm dev:tunnel).
      # The tunnel is same-origin but still CORS-checked, because the social login forms POST
      # and browsers send Origin on a POST navigation.
      allowedOriginPattern: "http:\\/\\/localhost:\\d+|https:\\/\\/[a-zA-Z0-9-]+\\.ngrok(-free)?\\.(app|dev|io)"
      allowCredentials: true
  maxNumberOfCoresToUse: 4
  ignite:
    discoveryType: SHAREDFS
  platformSecrets:
    # Auto-seeded on first boot by DevPlatformSecretsGenerator (dev profile only). Each
    # developer machine ends up with its own random keys; none of this is committed.
    # Production uses Azure Key Vault via the Secrets Store CSI driver — same file layout,
    # different origin.
    jwtSigningKeysPath: ${user.home}/.kinotic/dev-platform-secrets/jwt-signing-keys
  # OIDC client secrets resolve via SecretReferenceResolver — Azure Key Vault when
  # kinotic.domain.secretStorage.azure.vaultUrl is set, otherwise from KINOTIC_AKV_<name> env vars
  # (uppercased, non-alphanumerics → "_"). For local dev, export the env var matching the
  # secret name on the seeded OrgSignupOidcConfiguration / OidcConfiguration row.

logging:
  level:
    org:
      kinotic: TRACE

spring:
  ai:
    openai:
      api-key: "noop"
      base-url: https://api.x.ai
      chat:
        options:
          model: grok-4

