plugins {
	id 'org.kinotic.java-application-conventions'
}

sourceSets {
    main {
        java {
            exclude '**/test/**'
        }
    }
}

configurations {
    otelAgent {
        canBeResolved = true
        canBeConsumed = false
        // The agent is a self-contained shaded jar; only the single artifact is wanted
        transitive = false
    }
}

dependencies {
	implementation project(':kinotic-core')
	implementation project(':kinotic-domain')
	implementation project(':kinotic-os-api')
	implementation project(':kinotic-persistence')
	implementation project(':kinotic-github')
    implementation project(':kinotic-api-gateway')

	implementation 'com.github.ben-manes.caffeine:caffeine'

	implementation 'io.jsonwebtoken:jjwt-api'
	implementation 'io.jsonwebtoken:jjwt-impl'
	implementation 'io.jsonwebtoken:jjwt-jackson'

	implementation 'io.vertx:vertx-core'

	implementation 'io.projectreactor:reactor-core'

	implementation 'tools.jackson.core:jackson-databind'

	// The agent version tracks the instrumentation BOM version
	otelAgent "io.opentelemetry.javaagent:opentelemetry-javaagent:${otelInstrumentationBomVersion}"
}

tasks.named('processResources') {
	// kinotic-frontend is excluded from the build when CLAUDE_CLOUD_COMPILE=true
	if (findProject(':kinotic-frontend') != null) {
		dependsOn ":kinotic-frontend:copyDist"
	}
	// Embed the agent as BOOT-INF/classes/opentelemetry-javaagent.jar, the path the
	// docker-compose -javaagent arguments point at
	from(configurations.otelAgent) {
		rename { 'opentelemetry-javaagent.jar' }
	}
}

tasks.named('sourcesJar') {
	if (findProject(':kinotic-frontend') != null) {
		dependsOn ":kinotic-frontend:copyDist"
	}
}
