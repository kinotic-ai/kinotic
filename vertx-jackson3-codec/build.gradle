plugins {
    id 'org.kinotic.java-library-conventions'
}

description = 'A configurable Vert.x JSON codec backed by a Jackson 3 ObjectMapper'

// Jackson 3 requires Java 17 and vertx-core's baseline is 11, so 17 is the module's true floor.
// Overrides the repo-wide 25 so the published jar is usable outside this repo — including on
// 17-20 runtimes, where Vert.x never activates its own Jackson 3 codec (it lives in the jar's
// META-INF/versions/21 section) and this module is the only way to get one.
java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

dependencies {
    // both appear in the public API: JsonCodec/Buffer/JsonObject from vertx, JsonMapper.Builder from jackson
    api 'io.vertx:vertx-core'
    api 'tools.jackson.core:jackson-databind'
}
