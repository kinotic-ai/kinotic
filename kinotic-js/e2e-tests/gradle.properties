# This build only runs pnpm, so Gradle has nothing to gain from watching the file system, and the
# node_modules churn of a pnpm install floods the watcher with more events than the daemon's default
# 512 MiB heap holds: CI has seen the daemon die of "Java heap space" in the watcher thread between
# pnpmInstall and pnpmTest, before any test ran.
org.gradle.vfs.watch=false
