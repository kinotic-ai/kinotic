packages:
  - 'apps/*'
  - 'packages/*'

# Every @kinotic-ai package is pinned once here and referenced as `catalog:` by the
# workspace packages. management-api augments core's Kinotic singleton, so two versions
# of it in one graph give the apps different `Kinotic.*` service types.
catalog:
  '@kinotic-ai/core': ^5.0.0-beta.28
  '@kinotic-ai/idl': ^5.0.0-beta.1
  '@kinotic-ai/management-api': ^5.0.0-beta.66
  '@kinotic-ai/persistence': ^5.0.0-beta.18
  '@kinotic-ai/system-api': ^5.0.0-beta.32

  # The build toolchain the apps and frontend-common's library build share
  '@vitejs/plugin-vue': ^6.0.8
  typescript: ~5.8.3
  vite: ^8.2.1
  vue-tsc: ^2.2.12

  # The charting libraries frontend-common declares as optional peers and the system console renders with
  echarts: ^6.1.0
  vue-echarts: ^8.1.0

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  es5-ext: false
  vue-demi: false

minimumReleaseAge: 1440 # minutes; third-party releases younger than 24h are rejected

# First-party packages are trusted at any version, so a freshly-published release
# doesn't block the build.
minimumReleaseAgeExclude:
  - '@kinotic-ai/core'
  - '@kinotic-ai/idl'
  - '@kinotic-ai/management-api'
  - '@kinotic-ai/persistence'
  - '@kinotic-ai/system-api'
