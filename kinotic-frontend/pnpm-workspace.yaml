allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  es5-ext: false
  vue-demi: false

minimumReleaseAge: 1440 # minutes; third-party releases younger than 24h are rejected

# First-party packages are trusted; exclude them from the minimumReleaseAge
# supply-chain policy so a freshly-published release doesn't block the build.
minimumReleaseAgeExclude:
  - '@kinotic-ai/core@4.0.0'
  - '@kinotic-ai/idl@1.0.10'
  - '@kinotic-ai/os-api@4.1.0'
  - '@kinotic-ai/persistence@4.0.0'
