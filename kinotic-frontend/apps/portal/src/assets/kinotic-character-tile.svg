<svg width="139" height="139" viewBox="0 0 139 139" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kinotic character">
<rect width="138.824" height="138.824" rx="32.3922" fill="url(#paint0_linear_576_1682)"/>
<svg x="13.19" y="19.48" width="105.69" height="105.69" viewBox="0 0 300 300" fill="none">
  <style>
    /*
      GrokBot-inspired eye behavior:
      - shared wandering gaze
      - fast blink / softer reopen
      - occasional subtle expression squeeze/tilt
      This stays self-contained and works without JavaScript.
    */
    #eyes-gaze {
      transform-box: view-box;
      transform-origin: 150px 175px;
      animation: gaze 11.8s cubic-bezier(.4,0,.2,1) infinite;
    }

    .eye-expression {
      transform-box: fill-box;
      transform-origin: center;
      animation-duration: 11.8s;
      animation-timing-function: cubic-bezier(.34,1.56,.64,1);
      animation-iteration-count: infinite;
    }
    .eye-expression.left  { animation-name: expression-left; }
    .eye-expression.right { animation-name: expression-right; }

    .blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 6.4s cubic-bezier(.4,0,.2,1) infinite;
    }
    .blink.delay {
      animation-delay: 0.018s;
    }

    @keyframes gaze {
      0%, 8%   { transform: translate(0px, 0px); }
      13%, 24% { transform: translate(5.8px, -1.2px); }
      29%, 39% { transform: translate(0px, 0px); }
      45%, 58% { transform: translate(-6.6px, -2.8px); }
      63%, 70% { transform: translate(-2px, 1.5px); }
      75%, 86% { transform: translate(5px, 2.2px); }
      91%, 100%{ transform: translate(0px, 0px); }
    }

    @keyframes blink {
      0%, 44%, 48%, 76%, 80%, 100% { transform: scaleY(1); }
      45.0% { transform: scaleY(.14); }
      46.1% { transform: scaleY(.06); }
      47.3% { transform: scaleY(1); }
      77.0% { transform: scaleY(.18); }
      78.0% { transform: scaleY(.08); }
      79.1% { transform: scaleY(1); }
    }

    @keyframes expression-left {
      0%, 37%, 100% { transform: rotate(0deg) scaleX(1); }
      45%, 58% { transform: rotate(-1.6deg) scaleX(.96); }
      75%, 86% { transform: rotate(.9deg) scaleX(1.025); }
      92% { transform: rotate(0deg) scaleX(1); }
    }

    @keyframes expression-right {
      0%, 37%, 100% { transform: rotate(0deg) scaleX(1); }
      45%, 58% { transform: rotate(1.6deg) scaleX(.96); }
      75%, 86% { transform: rotate(-.9deg) scaleX(1.025); }
      92% { transform: rotate(0deg) scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #eyes-gaze, .eye-expression, .blink { animation: none !important; }
    }
  </style>

  <!-- Animated eyes -->
  <g id="eyes-gaze">
    <g class="eye-expression left">
      <g class="blink">
        <path d="M140.051 161.501H99.9532C98.3692 161.501 97.0851 162.786 97.0851 164.37V184.953C97.0851 186.537 98.3692 187.822 99.9532 187.822H140.051C141.635 187.822 142.919 186.537 142.919 184.953V164.37C142.919 162.786 141.635 161.501 140.051 161.501Z" fill="#28FEB4"/>
      </g>
    </g>
    <g class="eye-expression right">
      <g class="blink delay">
        <path d="M200.587 161.501H160.489C158.905 161.501 157.621 162.786 157.621 164.37V184.953C157.621 186.537 158.905 187.822 160.489 187.822H200.587C202.171 187.822 203.455 186.537 203.455 184.953V164.37C203.455 162.786 202.171 161.501 200.587 161.501Z" fill="#28FEB4"/>
      </g>
    </g>
  </g>

