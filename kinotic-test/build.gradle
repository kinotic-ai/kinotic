plugins {
	id 'org.kinotic.java-library-conventions'
	id 'io.freefair.lombok'
}

dependencies {
	implementation project(':kinotic-core')
	implementation project(':kinotic-domain')
	implementation project(':kinotic-management-api')
	implementation project(':kinotic-system-api')
	implementation project(':kinotic-idl')
	implementation project(':kinotic-persistence')
	implementation project(':kinotic-sql')

	// SecurityContext lives in kinotic-core but its API surface (Vertx) is hidden by `implementation`.
	// kinotic-test uses Vertx + SecurityContext to wrap test calls in withElevatedAccess.
	implementation 'io.vertx:vertx-core'

	implementation 'io.jsonwebtoken:jjwt-api'
	implementation 'io.jsonwebtoken:jjwt-impl'
	implementation 'io.jsonwebtoken:jjwt-jackson'

	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// Used to create the ElasticSearch client, for the migration tests
	implementation 'org.springframework.boot:spring-boot-starter-elasticsearch'

	implementation "com.github.ben-manes.caffeine:caffeine"


	// PersistenceInitializer injects HealthChecks (normally provided by the api-gateway module,
	// which this module doesn't depend on). KinoticTestBeansConfiguration supplies it for tests.
	testImplementation 'io.vertx:vertx-health-check'

	testImplementation 'io.projectreactor:reactor-test'

	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jackson-test'
	testImplementation 'org.springframework.security:spring-security-oauth2-client'

	testImplementation 'org.testcontainers:testcontainers'
	testImplementation 'org.testcontainers:testcontainers-elasticsearch'
}

test {
    systemProperty 'spring.profiles.active', 'test'
    // some tests take longer
    timeout = Duration.ofMinutes(10)
}
