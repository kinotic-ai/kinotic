# YAML Reference http://www.yaml.org/refcard.html
kinotic:
  debug: true
  # placeholder GitHub App config; the github beans are registered but never called in tests
  managementApi:
    github:
      disableProvisioner: true
      appId: "-"
      appSlug: "-"
      appPrivateKey: "-"
      webhookSecret: "-"
      repoTemplate: "-"
    # the bases of the callback URLs OwnedOidcConfigurationService gives and of the URL a UI build is
    # handed (appApiBaseUrl below); no test signs in through one or deploys a UI
    apiBaseUrl: http://localhost:9090
  domain:
    appApiBaseUrl: http://localhost:58505
    # the domain a UI's site is named under; no test deploys a UI
    publishedSites:
      domain: apps.localhost
  # the evaluation license key, which turns on every Enterprise Feature, so the OIDC configuration tests can save
  # Okta and Microsoft Entra configurations
  ee:
    licenseKey: eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJLaW5vdGljIEV2YWx1YXRpb24gLSBkZXZlbG9wbWVudCBhbmQgdGVzdGluZyBvbmx5LCBub3QgZm9yIHByb2R1Y3Rpb24gdXNlIiwiaWF0IjoxNzkzODQxOTgxLCJleHAiOjIxMTQyOTQ0MDAsImZlYXR1cmVzIjpbIioiXX0.41zerfYDi74rzxfDfRqUE_WFK44lvtOt2MKAY9_ECmsCpDaWJO2MuLvU_NGfXgV69XxVS3pkxMSB0JGIa1hKRg
  maxNumberOfCoresToUse: 4
  systemApi:
    deployment:
      # required at boot; no deployment ever runs in tests, workloads would reach the local gateway
      managementServer:
        host: localhost
      appServer:
        host: localhost
    # no site storage in tests: nothing is uploaded and every published UI reads ready at once;
    # the endpoint is a placeholder, validated at boot
    uiDeployment:
      siteStorage: DISABLED
      sitesStorageEndpoint: "-"

logging:
  level:
    org:
      springframework:
        web: DEBUG
        ai: DEBUG
      kinotic: TRACE
    io:
      vertx: DEBUG

