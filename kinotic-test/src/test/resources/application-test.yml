# YAML Reference http://www.yaml.org/refcard.html
kinotic:
  debug: true
  disableClustering: false
  # placeholder GitHub App config; the github beans are registered but never called in tests
  managementApi:
    github:
      disableProvisioner: true
      appId: "-"
      appSlug: "-"
      appPrivateKey: "-"
      webhookSecret: "-"
      repoTemplate: "-"
  maxNumberOfCoresToUse: 4
  systemApi:
    deployment:
      # required at boot; no deployment ever runs in tests, workloads would reach the local gateway
      serverHost: localhost

logging:
  level:
    org:
      springframework:
        web: DEBUG
        ai: DEBUG
      kinotic: TRACE
    io:
      vertx: DEBUG

