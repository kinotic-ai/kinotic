# YAML Reference http://www.yaml.org/refcard.html
kinotic:
  debug: true
  # placeholder GitHub App config; the github beans are registered but never called in tests
  managementApi:
    github:
      disableProvisioner: true
      appId: "-"
      appSlug: "-"
      appPrivateKey: "-"
      webhookSecret: "-"
      repoTemplate: "-"
  maxNumberOfCoresToUse: 4
  systemApi:
    # no sites account in tests: the site provisioner is the mock
    disableAzureStorage: true
    deployment:
      # required at boot; no deployment ever runs in tests, workloads would reach the local gateway
      managementServer:
        host: localhost
      appServer:
        host: localhost
    # placeholder site config, validated at boot; no test deploys a UI
    uiDeployment:
      sitesDomain: apps.localhost
      sitesStorageEndpoint: "-"

logging:
  level:
    org:
      springframework:
        web: DEBUG
        ai: DEBUG
      kinotic: TRACE
    io:
      vertx: DEBUG

