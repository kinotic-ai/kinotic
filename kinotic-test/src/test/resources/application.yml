spring:
  profiles:
    active: test
  ai:
    openai:
      api-key: "test-key"
      base-url: https://api.x.ai
      chat:
        options:
          model: grok-4
  main:
    allow-bean-definition-overriding: true


kinotic:
  debug: true
  maxNumberOfCoresToUse: 4
  domain:
    email:
      # the test node sends no mail: a sign-up's or an invitation's link is logged instead
      enabled: false
      # the UI the emailed links open; the test node presents the management server's development UI
      linkBaseUrl: http://localhost:9090
    oauth:
      # Placeholder for tests only; nothing here drives the authorization-code flow, but the list
      # is validated non-empty so the context starts.
      allowedClientIds:
        - https://example.com/test-client-metadata
    secretStorage:
      # Dummy Base64-encoded key for tests only; lets SecretNameDeriver start in the test context.
      masterKey: a2lub3RpYy10ZXN0LW1hc3Rlci1rZXktZHVtbXktMDA=

logging:
  level:
    org:
      springframework:
        web: DEBUG
      kinotic: TRACE
    io:
      vertx: DEBUG

