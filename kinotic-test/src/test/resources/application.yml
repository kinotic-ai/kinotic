spring:
  profiles:
    active: test
  ai:
    openai:
      api-key: "test-key"
      base-url: https://api.x.ai
      chat:
        options:
          model: grok-4
  main:
    allow-bean-definition-overriding: true


kinotic:
  debug: true
  maxNumberOfCoresToUse: 4
  domain:
    # the portal the links open: the one the management server serves on 9090
    portalBaseUrl: http://localhost:9090
    email:
      # no Azure Communication Services here: an invitation or verification send logs its link instead
      enabled: false
    oauth:
      # Placeholder for tests only; nothing here drives the authorization-code flow, but the list
      # is validated non-empty so the context starts.
      allowedClientIds:
        - https://example.com/test-client-metadata
    secretStorage:
      # Dummy Base64-encoded key for tests only; lets SecretNameDeriver start in the test context.
      masterKey: a2lub3RpYy10ZXN0LW1hc3Rlci1rZXktZHVtbXktMDA=

logging:
  level:
    org:
      springframework:
        web: DEBUG
      kinotic: TRACE
    io:
      vertx: DEBUG

