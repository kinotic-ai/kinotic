# Azure overrides for Loki: chunks, index and rules in Azure Blob Storage, in the loki-chunks and
# loki-ruler containers of the observability storage account (observability.tf). The persistent
# volume holds only the write-ahead log and the index cache.
# Loki authenticates as its own workload identity; terraform sets the account name
# (loki.storage.azure.accountName) and the identity's client id (serviceAccount.annotations).

loki:
  # The workload identity webhook injects the federated token into pods with this label
  podLabels:
    azure.workload.identity/use: "true"

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: azure
    azure:
      useFederatedToken: true
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler

  # The log deletion API (a workload's logs go with its record) needs a delete request store; on
  # Azure that store is the object store the chunks live in
  compactor:
    delete_request_store: azure
