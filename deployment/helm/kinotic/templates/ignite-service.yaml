# Headless service for Ignite node discovery in Kubernetes: every server's pods, so the three
# servers form one cluster. Each server's application-kubernetes.yml names it.
apiVersion: v1
kind: Service
metadata:
  name: kinotic
  labels:
    app.kubernetes.io/part-of: {{ include "kinotic.name" . }}
    component: ignite-discovery
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/part-of: {{ include "kinotic.name" . }}
  ports:
    - name: discovery
      port: {{ .Values.kinotic.cluster.discoveryPort | default 47500 }}
      targetPort: {{ .Values.kinotic.cluster.discoveryPort | default 47500 }}
      protocol: TCP
    - name: communication
      port: {{ .Values.kinotic.cluster.communicationPort | default 47100 }}
      targetPort: {{ .Values.kinotic.cluster.communicationPort | default 47100 }}
      protocol: TCP
  publishNotReadyAddresses: true
