apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kinotic.fullname" . }}
  labels:
    app.kubernetes.io/part-of: {{ include "kinotic.name" . }}
rules:
  # Required for Ignite Kubernetes IP Finder
  # See: https://ignite.apache.org/docs/latest/clustering/kubernetes
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services"]
    verbs: ["get", "list", "watch"]

