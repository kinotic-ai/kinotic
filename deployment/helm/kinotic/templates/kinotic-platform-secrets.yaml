{{- if .Values.platformSecrets.keyVault.name }}
{{- range $name, $server := .Values.servers }}
{{- if $server.enabled }}
---
# Projects this server's platform secrets from the global Azure Key Vault into its pods: its own
# JWT key set, as jwt-signing-keys, and the secret-storage master keys. The driver's rotation loop
# refreshes the mounted files in place when Key Vault values change, and PlatformSecretsService's
# file watcher picks up the new content. No pod restart needed. Not rendered in KinD — there, a
# Secret created by local terraform is mounted instead.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $name }}-platform-secrets
  labels:
    app: {{ $name }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "platformSecrets + keyVault requires workloadIdentity.clientId" $.Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ $.Values.platformSecrets.keyVault.name | quote }}
    tenantId: {{ required "platformSecrets.keyVault.tenantId is required" $.Values.platformSecrets.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ $name }}-jwt-signing-keys
          objectAlias: jwt-signing-keys
          objectType: secret
        - |
          objectName: {{ $.Values.platformSecrets.objects.secretStorageMasterKeys }}
          objectType: secret
{{- end }}
{{- end }}
{{- end }}
