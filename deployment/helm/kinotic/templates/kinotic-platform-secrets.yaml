{{- if .Values.platformSecrets.keyVault.name }}
{{- range $name, $server := .Values.servers }}
{{- if $server.enabled }}
---
# Projects this server's platform secrets from the global Azure Key Vault into its pods, as the
# files kinotic.platformSecretFiles lists: its own JWT key set, and the properties the server
# imports as a config tree. The driver's rotation loop refreshes the mounted files in place when
# Key Vault values change; PlatformSecretsService's file watcher picks up a new JWT key set without
# a restart, and the imported properties are read when the server starts. Not rendered in KinD —
# there, a Secret created by local terraform is mounted instead.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $name }}-platform-secrets
  labels:
    app: {{ $name }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "platformSecrets + keyVault requires workloadIdentity.clientId" $.Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ $.Values.platformSecrets.keyVault.name | quote }}
    tenantId: {{ required "platformSecrets.keyVault.tenantId is required" $.Values.platformSecrets.keyVault.tenantId | quote }}
    objects: |
      array:
      {{- range $file := include "kinotic.platformSecretFiles" (dict "name" $name "server" $server "root" $) | fromYamlArray }}
        - |
          objectName: {{ $file.object }}
          objectAlias: {{ $file.path }}
          objectType: secret
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
