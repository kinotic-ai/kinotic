{{- range $name, $server := .Values.servers }}
{{- if $server.enabled }}
{{- if eq ($server.service.type | default "ClusterIP") "LoadBalancer" }}
---
# ── External Service (LoadBalancer) ──────────────────────
# The gateway alone, on 443; the portal is served outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: "gateway"
      protocol: TCP
      port: 443
      targetPort: {{ $server.gatewayPort }}
  selector:
    app: {{ $name }}
---
# ── Internal Service (ClusterIP) ─────────────────────────
# Every port, on its own number — reachable only within the cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-internal
  labels:
    app: {{ $name }}
spec:
  type: ClusterIP
  ports:
    - name: "gateway"
      protocol: TCP
      port: {{ $server.gatewayPort }}
      targetPort: {{ $server.gatewayPort }}
  selector:
    app: {{ $name }}
{{- else }}
---
# ── Single Service (ClusterIP) ───────────────────────────
# Every port on one service, reachable only within the cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: "gateway"
      protocol: TCP
      port: {{ $server.gatewayPort }}
      targetPort: {{ $server.gatewayPort }}
  selector:
    app: {{ $name }}
{{- end }}
{{- end }}
{{- end }}
