{{- range $name, $server := .Values.servers }}
{{- if $server.enabled }}
---
# Projects this server's system secrets from the global Azure Key Vault into its pods, as the
# files kinotic.systemSecretFiles lists: its own JWT key set, and the properties the server
# imports as a config tree. The driver's rotation loop refreshes the mounted files in place when
# Key Vault values change; SystemSecretsService's file watcher picks up a new JWT key set without
# a restart, and the imported properties are read when the server starts.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $name }}-system-secrets
  labels:
    app: {{ $name }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "systemSecrets + keyVault requires workloadIdentity.clientId" $.Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "systemSecrets.keyVault.name is required" $.Values.systemSecrets.keyVault.name | quote }}
    tenantId: {{ required "systemSecrets.keyVault.tenantId is required" $.Values.systemSecrets.keyVault.tenantId | quote }}
    objects: |
      array:
      {{- range $file := include "kinotic.systemSecretFiles" (dict "name" $name "server" $server "root" $) | fromYamlArray }}
        - |
          objectName: {{ $file.object }}
          objectAlias: {{ $file.path }}
          objectType: secret
      {{- end }}
{{- end }}
{{- end }}
