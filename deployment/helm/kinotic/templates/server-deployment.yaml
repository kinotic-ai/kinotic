{{- range $name, $server := .Values.servers }}
{{- if $server.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: {{ include "kinotic.name" $ }}
spec:
  replicas: {{ $server.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "kinotic.serverEnv" (dict "name" $name "server" $server "root" $) | sha256sum }}
        {{- if $.Values.tls.enabled }}
        secret.reloader.stakater.com/reload: {{ $server.tlsSecretName | quote }}
        {{- end }}
      labels:
        app: {{ $name }}
        release: {{ $.Release.Name }}
        # Every server's pods join the headless Service Ignite discovers its peers through
        app.kubernetes.io/part-of: {{ include "kinotic.name" $ }}
        {{- if $.Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "kinotic.fullname" $ }}
      terminationGracePeriodSeconds: 60  # Allow time for WebSocket connections to close gracefully
      containers:
        - name: {{ $name }}
          image: {{ include "kinotic.image" (dict "image" $server.image "root" $) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          lifecycle:
            preStop:
              exec:
                # Give WebSocket connections time to close gracefully before SIGTERM
                command: ["/bin/sh", "-c", "sleep 15"]
          readinessProbe:
            httpGet:
              path: "/health"
              port: {{ $server.gatewayPort }}
              {{- if $.Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 10
            failureThreshold: 15
            periodSeconds: 10
            timeoutSeconds: 7
          startupProbe:
            httpGet:
              path: "/health"
              port: {{ $server.gatewayPort }}
              {{- if $.Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 30
            failureThreshold: 15
            periodSeconds: 10
            timeoutSeconds: 7
          livenessProbe:
            httpGet:
              path: "/health"
              port: {{ $server.gatewayPort }}
              {{- if $.Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 30
            failureThreshold: 30
            periodSeconds: 30
            timeoutSeconds: 7
          ports:
            {{- if $server.webServer.enabled }}
            - containerPort: {{ $server.webServer.port }} # the portal's static server
            {{- end }}
            - containerPort: {{ $server.gatewayPort }} # REST, STOMP and MCP
            - containerPort: {{ $.Values.kinotic.cluster.discoveryPort | default 47500 }} # Ignite Discovery Port
            - containerPort: {{ $.Values.kinotic.cluster.communicationPort | default 47100 }} # Ignite Communication Port
          {{- with $server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $name }}
          env:
            # The node's service instance id
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The service_instance_id label Alloy gives this pod's logs
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.instance.id=$(POD_NAME)"
            - name: KINOTIC_DOMAIN_ELASTICUSERNAME
              value: "{{ $.Values.kinotic.elastic.username }}"
            - name: KINOTIC_DOMAIN_ELASTICPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.kinotic.elastic.secretName }}
                  key: {{ $.Values.kinotic.elastic.secretKey }}
            - name: KINOTIC_DOMAIN_SYSTEMSECRETS_JWTSIGNINGKEYSPATH
              value: "{{ $.Values.systemSecrets.mountPath }}/jwt-signing-keys"
            # Each file of the system-secrets volume sets the property it is named after
            - name: SPRING_CONFIG_IMPORT
              value: "configtree:{{ $.Values.systemSecrets.mountPath }}/"
          volumeMounts:
            - name: tmp-work
              mountPath: /workspace/ignite/work
            {{- if $.Values.tls.enabled }}
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            {{- end }}
            - name: system-secrets
              mountPath: {{ $.Values.systemSecrets.mountPath }}
              readOnly: true
      restartPolicy: Always
      nodeSelector: {{ toYaml $.Values.nodeSelector | nindent 8 }}
      volumes:
        - name: tmp-work
          emptyDir:
            sizeLimit: 1Gi
        {{- if $.Values.tls.enabled }}
        - name: tls-certs
          secret:
            secretName: {{ $server.tlsSecretName }}
        {{- end }}
        # The files kinotic.systemSecretFiles lists for this server: its own JWT key set, never
        # another server's, and the secret properties it imports
        - name: system-secrets
          # The CSI driver projects this server's SecretProviderClass objects from Key Vault and
          # refreshes them in place when Key Vault values change.
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ $name }}-system-secrets
{{- end }}
{{- end }}
