nameOverride: ""

# The servers' and the migration's image tag, and how every image is pulled
image:
  tag: "5.0.0-SNAPSHOT"
  pullPolicy: Always

# The three servers. Each is a Deployment, a Service and a ConfigMap named after its key, and
# every server's pods join the headless `kinotic` Service, through which Ignite discovers its
# peers, so the three form one cluster. What they share is configured further down.
servers:
  kinotic-server-management:
    enabled: true
    replicaCount: 1
    image:
      repository: kinoticai/kinotic-server-management
      sha: ""
    # kinotic.apiGateway.stompPort: REST, STOMP and MCP
    gatewayPort: 58503
    # kinotic.managementServer.*: the Turnstile site this server's open routes are guarded by; the
    # URLs of its API and the portal are kinotic.managementApi.apiBaseUrl and kinotic.domain.portalBaseUrl below
    managementServer:
      # kinotic.managementServer.turnstile.siteKey: the Cloudflare Turnstile site the portal's
      # find-my-organizations form presents; its secret is mounted with turnstile set below
      turnstile:
        siteKey: ""
    # The Secret holding this server's certificate when tls.enabled
    tlsSecretName: kinotic-server-management-tls
    # Mounts the system GitHub App's private key and webhook secret, which a server loading
    # management-api requires
    githubApp: true
    # Mounts the Cloudflare DNS token, with which this server creates an organization's sites
    # record when an organization signs up
    cloudflareDns: true
    # Mounts the Turnstile site's secret key, with which this server verifies the token each
    # find-my-organizations request carries
    turnstile: true
    service:
      type: ClusterIP
    resources: {}
    # Environment variables this server alone gets, on top of extraEnv
    extraEnv: {}

  kinotic-server-system:
    enabled: true
    replicaCount: 1
    image:
      repository: kinoticai/kinotic-server-system
      sha: ""
    gatewayPort: 58504
    # kinotic.systemServer.*: the URLs this server is reached at (no trailing slashes)
    systemServer:
      # this server's REST endpoints, the base of its OIDC redirect_uris and its OAuth issuer
      apiBaseUrl: "http://localhost:58504"
      # the system console, where browser flows return
      consoleBaseUrl: "http://localhost:5174"
    tlsSecretName: kinotic-server-system-tls
    turnstile: false
    githubApp: true
    # the system server creates an organization's sites record before its first site is published
    cloudflareDns: true
    service:
      type: ClusterIP
    resources: {}
    extraEnv: {}

  kinotic-server-app:
    enabled: true
    replicaCount: 1
    image:
      repository: kinoticai/kinotic-server-app
      sha: ""
    gatewayPort: 58505
    tlsSecretName: kinotic-server-app-tls
    turnstile: false
    githubApp: false
    cloudflareDns: false
    service:
      type: ClusterIP
    resources: {}
    extraEnv: {}

migration:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  image:
    repository: kinoticai/kinotic-migration
    sha: ""

# JVM / Buildpack, for every server
properties:
  springActiveProfiles: "production,debug"
  enableJmx: true
  enableNmt: true
  javaToolOptions: "-Djava.net.preferIPv4Stack=true -XX:MaxDirectMemorySize=512m"
  bplJvmHeadRoom: 10

# Where each server's OpenTelemetry agent exports its traces and metrics: the OTLP/HTTP endpoints
# of Tempo and Mimir
otel:
  tracesEndpoint: "http://tempo.observability.svc:4318/v1/traces"
  metricsEndpoint: "http://mimir.observability.svc:9009/otlp/v1/metrics"

# What every server shares — mirrors the Spring property structure:
#   kinotic.domain.*       → the app API and portal URLs, email, Elasticsearch
#   kinotic.managementApi.* → the management API's URL, the stores LogService and TelemetryService query
#   kinotic.ignite.*       → the cluster (set in each server's application-kubernetes.yml)
kinotic:
  domain:
    # kinotic.domain.appApiBaseUrl: the base every application's API host is a label under
    # (https://<organizationId>--<applicationId>.<domain>), as a browser reaches it: what the app
    # server serves, each host its own OAuth issuer; what the system server hands each UI build; and
    # the host of the callback URL of an application's and a tenant's OIDC configurations
    appApiBaseUrl: "http://localhost:58505"
    # kinotic.domain.portalBaseUrl: the portal (no trailing slash), where the management server's
    # browser flows return and where the emailed verification and invite links open
    portalBaseUrl: "http://localhost:9090"
    # kinotic.domain.email.* — outbound mail via Azure Communication Services
    email:
      # When false, EmailService logs verification URLs instead of sending. Required for
      # local/dev environments without a real ACS resource.
      enabled: false
      endpoint: ""
      senderAddress: ""
      managedIdentityClientId: ""
  # kinotic.managementApi.* — management-api configuration, loaded by the org and system servers
  managementApi:
    # kinotic.managementApi.apiBaseUrl: the management server's REST endpoints as a browser
    # reaches them (no trailing slash), the base of its OIDC redirect_uris and of the callback URL of
    # an organization's own OIDC configurations
    apiBaseUrl: "http://localhost:58503"
    # Loki HTTP API backing the LogService
    lokiUrl: "http://loki.observability.svc:3100"
    # Tempo and Mimir HTTP APIs backing the TelemetryService
    tempoUrl: "http://tempo.observability.svc:3100"
    mimirUrl: "http://mimir.observability.svc:9009"
  elastic:
    connections:
      - host: "kinotic-es-es-http.elastic.svc"
        port: 9200
        scheme: "http"
    connectionTimeout: "5s"
    socketTimeout: "60s"
    username: "elastic"
    secretName: "kinotic-es-es-elastic-user"
    secretKey: "elastic"
  # kinotic.ignite.* — the ports the headless `kinotic` Service exposes
  cluster:
    discoveryPort: 47500
    communicationPort: 47100

# TLS (kinotic.apiGateway.ssl.*): each server terminates TLS with the certificate in its
# servers.<name>.tlsSecretName
tls:
  enabled: false

nodeSelector: {}

# Workload identity (Azure) — enables keyless auth to Azure services
workloadIdentity:
  enabled: false
  clientId: ""

# System secrets, mounted as files at systemSecrets.mountPath: each server's JWT signing keys,
# which the server watches for in-place rotation, and the secret properties it imports from the
# directory as a config tree, each file named after the property it sets. Each server signs with a
# key set of its own, the object `<server>-jwt-signing-keys`. The Secrets Store CSI driver projects
# them from the global Key Vault, so keyVault.* must be set.
systemSecrets:
  mountPath: /etc/kinotic/system-secrets
  keyVault:
    name: ""        # from global/ terraform output: platform_key_vault_name
    tenantId: ""    # from global/ terraform output: tenant_id
  # The Key Vault secret names of the imported properties
  objects:
    # kinotic.domain.secretStorage.masterKey, the same for every server
    secretStorageMasterKey: kinotic-secret-storage-master-key
    # kinotic.managementApi.github.appPrivateKey and webhookSecret, on a server with githubApp set
    githubAppPrivateKey: kinotic-github-app-private-key
    githubWebhookSecret: kinotic-github-webhook-secret
    # kinotic.domain.publishedSites.cloudflare.apiToken, on a server with cloudflareDns set: the management
    # server creates an organization's sites record at sign-up, the system server before its first publish
    cloudflareDnsApiToken: kinotic-cloudflare-dns-api-token
    # kinotic.managementServer.turnstile.secretKey, on a server with turnstile set: the management server
    # verifies the token the portal's find-my-organizations form earns from the Turnstile site
    turnstileSecretKey: kinotic-turnstile-secret-key

# OIDC client secrets are now resolved at runtime by SecretReferenceResolver — Azure Key
# Vault in production (kinotic.domain.secretStorage.azure.vaultUrl) or KINOTIC_AKV_<sanitizedName>
# env vars in dev/local. The secret name on each OidcConfiguration row points at the AKV
# entry; nothing is mounted into the pod.

# Environment variables every server gets — override any Spring property via env var convention.
# Example: KINOTIC_DOMAIN_ELASTICHEALTHCHECKINTERVAL: "30s"
extraEnv: {}
