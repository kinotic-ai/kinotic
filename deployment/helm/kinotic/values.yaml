nameOverride: ""

# The servers' and the migration's image tag, and how every image is pulled
image:
  tag: "5.0.0-SNAPSHOT"
  pullPolicy: Always

# The three servers. Each is a Deployment, a Service and a ConfigMap named after its key, and
# every server's pods join the headless `kinotic` Service, through which Ignite discovers its
# peers, so the three form one cluster. What they share is configured further down.
servers:
  kinotic-org-server:
    enabled: true
    replicaCount: 1
    image:
      repository: kinoticai/kinotic-org-server
      sha: ""
    # kinotic.apiGateway.stompPort: REST, STOMP and MCP
    gatewayPort: 58503
    # kinotic.apiGateway.webServer.*: the portal's files, served from the jar. Disabled where the
    # portal is hosted outside the cluster.
    webServer:
      enabled: true
      port: 9090
    domain:
      # kinotic.domain.appBaseUrl: the portal (no trailing slash) — verification email links and
      # post-OIDC redirects
      appBaseUrl: "http://localhost:9090"
      # kinotic.domain.apiBaseUrl: this server's REST endpoints (no trailing slash) — the OIDC
      # redirect_uri. Empty falls back to appBaseUrl, which is correct for a same-origin deploy.
      apiBaseUrl: ""
    # The Secret holding this server's certificate when tls.enabled
    tlsSecretName: kinotic-org-server-tls
    # Mounts the platform GitHub App's private key and webhook secret, which a server loading
    # management-api requires
    githubApp: true
    service:
      type: ClusterIP
      nodePorts:
        gateway: null
        ui: null
        uiDirect: null
    resources: {}
    # Environment variables this server alone gets, on top of extraEnv
    extraEnv: {}

  kinotic-system-server:
    enabled: true
    replicaCount: 1
    image:
      repository: kinoticai/kinotic-system-server
      sha: ""
    gatewayPort: 58504
    webServer:
      enabled: false
    domain:
      # the system console, and this server's REST endpoints
      appBaseUrl: ""
      apiBaseUrl: ""
    tlsSecretName: kinotic-system-server-tls
    githubApp: true
    service:
      type: ClusterIP
      nodePorts:
        gateway: null
    resources: {}
    extraEnv: {}

  kinotic-app-server:
    enabled: true
    replicaCount: 1
    image:
      repository: kinoticai/kinotic-app-server
      sha: ""
    gatewayPort: 58505
    webServer:
      enabled: false
    # Every application's host is its own base URL and issuer, under kinotic.domain.appApiBaseUrl
    domain:
      appBaseUrl: ""
      apiBaseUrl: ""
    tlsSecretName: kinotic-app-server-tls
    githubApp: false
    service:
      type: ClusterIP
      nodePorts:
        gateway: null
    resources: {}
    extraEnv: {}

migration:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  image:
    repository: kinoticai/kinotic-migration
    sha: ""

# JVM / Buildpack, for every server
properties:
  springActiveProfiles: "production,debug"
  enableJmx: true
  enableNmt: true
  javaToolOptions: "-Djava.net.preferIPv4Stack=true -XX:MaxDirectMemorySize=512m"
  # JPMS opens/exports required by Apache Ignite (java.base reflection) and
  # Calcite/Janino runtime code generation (jdk.compiler internals).
  # Concatenated onto JAVA_TOOL_OPTIONS in each server's ConfigMap.
  javaModuleAccess: "--add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"
  bplJvmHeadRoom: 10

# What every server shares — mirrors the Spring property structure:
#   kinotic.domain.*       → application API hosts, email, Elasticsearch
#   kinotic.managementApi.* → the stores LogService queries
#   kinotic.ignite.*       → the cluster (set in each server's application-kubernetes.yml)
kinotic:
  domain:
    # kinotic.domain.appApiBaseUrl: the base URL every application's API host is a label under
    # (https://<organizationId>--<applicationId>.<domain>). The app server serves those hosts and
    # the system server hands them to UI builds. Empty keeps the property's default.
    appApiBaseUrl: ""
    # kinotic.domain.email.* — outbound mail via Azure Communication Services
    email:
      # When false, EmailService logs verification URLs instead of sending. Required for
      # local/dev environments without a real ACS resource.
      enabled: false
      endpoint: ""
      senderAddress: ""
      managedIdentityClientId: ""
  # kinotic.managementApi.* — management-api configuration, loaded by the org and system servers
  managementApi:
    # Loki HTTP API backing the LogService
    lokiUrl: "http://loki.observability.svc:3100"
  elastic:
    connections:
      - host: "kinotic-es-es-http.elastic.svc"
        port: 9200
        scheme: "http"
    connectionTimeout: "5s"
    socketTimeout: "60s"
    username: "elastic"
    secretName: "kinotic-es-es-elastic-user"
    secretKey: "elastic"
  # kinotic.ignite.* — the ports the headless `kinotic` Service exposes
  cluster:
    discoveryPort: 47500
    communicationPort: 47100

# TLS (kinotic.apiGateway.ssl.*): each server terminates TLS with the certificate in its
# servers.<name>.tlsSecretName
tls:
  enabled: false

evictionTracking:
  enabled: false
  mountPath: "/eviction-data"
  hostPath: "/tmp/kinotic-eviction-data"

nodeSelector: {}

# Workload identity (Azure) — enables keyless auth to Azure services
workloadIdentity:
  enabled: false
  clientId: ""

# Platform secrets, mounted as files at platformSecrets.mountPath: each server's JWT signing keys,
# which the server watches for in-place rotation, and the secret properties it imports from the
# directory as a config tree, each file named after the property it sets. Each server signs with a
# key set of its own, the object `<server>-jwt-signing-keys`. Always required in clustered
# environments: Azure projects them via the Secrets Store CSI driver from the global Key Vault
# (keyVault.* must be set); KinD mounts a k8s Secret generated by local terraform.
platformSecrets:
  mountPath: /etc/kinotic/platform-secrets
  # Source — exactly one of `keyVault` (Azure CSI) or `secretName` (KinD k8s Secret) is used.
  keyVault:
    name: ""        # from global/ terraform output: platform_key_vault_name
    tenantId: ""    # from global/ terraform output: tenant_id
  secretName: ""    # KinD: a k8s Secret in the release namespace holding every server's objects
  # The Key Vault secret names, or keys of secretName, of the imported properties
  objects:
    # kinotic.domain.secretStorage.masterKey, the same for every server
    secretStorageMasterKey: kinotic-secret-storage-master-key
    # kinotic.managementApi.github.appPrivateKey and webhookSecret, on a server with githubApp set
    githubAppPrivateKey: kinotic-github-app-private-key
    githubWebhookSecret: kinotic-github-webhook-secret

# OIDC client secrets are now resolved at runtime by SecretReferenceResolver — Azure Key
# Vault in production (kinotic.domain.secretStorage.azure.vaultUrl) or KINOTIC_AKV_<sanitizedName>
# env vars in dev/local. The secret name on each OidcConfiguration row points at the AKV
# entry; nothing is mounted into the pod.

# Environment variables every server gets — override any Spring property via env var convention.
# Example: KINOTIC_DOMAIN_ELASTICHEALTHCHECKINTERVAL: "30s"
extraEnv: {}
