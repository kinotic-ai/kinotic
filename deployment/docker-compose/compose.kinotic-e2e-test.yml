# Minimal compose for the e2e tests: Elasticsearch + migration + kinotic-server (no Kibana, OTEL, gen-schemas).
include:
  - compose.elasticsearch.yml
  - compose.kinotic-migration.yml
  - compose.kinotic-server.yml

services:
  kinotic-elasticsearch:
    volumes: !reset []
  kinotic-migration:
    environment:
      # 'test' activates the e2e fixture migrations (V5__e2e_app_fixtures.test.sql).
      SPRING_PROFILES_ACTIVE: development,test,compose
  kinotic-server:
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=512m # remove otel javaagent for test
      SPRING_PROFILES_ACTIVE: test,e2e-tests,compose
      SPRING_AI_OPENAI_API-KEY: "noop"
      # GitHub is disabled for e2e; the domain MockProjectRepoProvisioner supplies a no-op
      # ProjectRepoProvisioner so project-create flows work without a configured GitHub App.
      KINOTIC_DISABLEGITHUB: "true"
