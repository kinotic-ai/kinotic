services:
  kinotic-server:
    container_name: kinotic-server
    # Matches kinotic-migration: a locally present image wins, so CI can point the stack at the
    # image built from this commit by tagging it here. Run `docker compose pull` to refresh from
    # Docker Hub.
    pull_policy: missing
    image: kinoticai/kinotic-server:${kinoticVersion:-5.0.0-SNAPSHOT}
    depends_on:
      kinotic-elasticsearch:
        condition: service_healthy
      kinotic-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/workspace/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    ports:
      - "127.0.0.1:9090:9090" # UI PORT
      - "127.0.0.1:9091:9091" # UI PORT
      - "127.0.0.1:58503:58503" # Stomp Port
    environment:
      BPL_JVM_HEAD_ROOM: 10
      # The --add-exports=jdk.compiler/* flags would only matter for the HFT (Chronicle Map)
      # secret-storage backend, which needs runtime codegen. The Paketo bootBuildImage produces
      # a JRE-only image without jdk.compiler, so those flags would be no-ops. Compose runs with
      # the in-memory backend (dev default) so codegen never happens. If you want to switch to
      # HFT, run from the IDE on a full JDK instead — see application-development.yml.
      JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=512m -javaagent:/workspace/BOOT-INF/classes/opentelemetry-javaagent.jar --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
      KINOTIC_MAX_OFF_HEAP_MEMORY: 419430400
      KINOTIC_DOMAIN_ELASTICCONNECTIONS_0_SCHEME: http
      KINOTIC_DOMAIN_ELASTICCONNECTIONS_0_HOST: kinotic-elasticsearch
      KINOTIC_DOMAIN_ELASTICCONNECTIONS_0_PORT: 9200
      KINOTIC_DOMAIN_LOKI_URL: http://loki:3100
      KINOTIC_APIGATEWAY_WEBSERVER_PORT: 9090
      OTEL_SERVICE_NAME: kinotic-server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: service.name=kinotic-server
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      # jvm.buffer.* and jvm.system.cpu.* are Development-stability metrics the agent gates
      # behind this flag. Direct buffers matter here — Vert.x and Netty allocate off-heap
      # against MaxDirectMemorySize.
      OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_EMIT_EXPERIMENTAL_TELEMETRY: "true"
      SPRING_PROFILES_ACTIVE: development,compose
      KINOTIC_DOMAIN_APPBASEURL: "http://localhost:9090"
      KINOTIC_DOMAIN_EMAIL_ENABLED: "false"
      SPRING_AI_OPENAI_API-KEY: "noop"
      SPRING_AI_OPENAI_BASE_URL: "https://api.x.ai"
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: "grok-4"
      THC_PORT: 58503 # Paketo health-check probe — health endpoint is mounted on the api-gateway router (stomp port)
      THC_PATH: /health # THC defaults to "/", which 404s; the api-gateway only mounts /health
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    deploy:
      resources:
        reservations:
          memory: 4G
        limits:
          memory: 4G
    extra_hosts:
      - "host.docker.internal:host-gateway"