services:
  kinotic-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.4
    container_name: kinotic-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail 127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s
    ports:
      - "9200:9200"  # Elasticsearch HTTP API
      - "9300:9300"  # Elasticsearch transport
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          memory: 4G
        limits:
          memory: 4G
    volumes:
      # Named volume (not a host bind mount) so consumers don't need to override it: dev keeps the
      # data across `down`, and the test/e2e stacks get a fresh project-scoped volume cleared by `down -v`.
      - kinotic-elastic-data:/usr/share/elasticsearch/data

volumes:
  kinotic-elastic-data:
