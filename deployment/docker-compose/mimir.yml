target: all

multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095

distributor:
  pool:
    health_check_ingesters: true

ingester:
  ring:
    kvstore:
      store: inmemory
    replication_factor: 1

limits:
  ingestion_rate: 10000
  ingestion_burst_size: 20000
  # 0 means unlimited for the series limits, but 0 means DISABLED for exemplars — leaving it
  # at the default silently breaks the metric-to-trace links the Mimir datasource declares.
  max_global_series_per_user: 0
  max_global_series_per_metric: 0
  max_global_exemplars_per_user: 100000
  # Store OTLP metrics under their Prometheus-convention names (jvm_memory_used_bytes,
  # http_server_request_duration_seconds_bucket). Mimir defaults this off, which strips the
  # unit and _total suffixes and leaves every stock dashboard and PromQL example matching
  # nothing.
  otel_metric_suffixes_enabled: true

compactor:
  compaction_interval: 10m

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /var/mimir/blocks
  bucket_store:
    sync_dir: /var/mimir/tsdb-sync

store_gateway:
  sharding_ring:
    kvstore:
      store: inmemory
    replication_factor: 1

# query-frontend has no per-tenant queue config here — query_scheduler below owns queueing
# when both components run (which they do under `target: all`). The legacy
# frontend.max_outstanding_per_tenant field was removed from Mimir's CombinedFrontendConfig.
query_scheduler:
  max_outstanding_requests_per_tenant: 1024
