# The three Kinotic servers, one Ignite cluster: kinotic-org-server (the portal and the org API),
# kinotic-system-server (the platform's own API) and kinotic-app-server (every application's API).

# What every server container shares; each service below adds its image, ports and identity.
x-kinotic-server: &kinotic-server
  # Matches kinotic-migration: a locally present image wins, so CI can point the stack at the
  # image built from this commit by tagging it here. Run `docker compose pull` to refresh from
  # Docker Hub.
  pull_policy: missing
  depends_on:
    kinotic-elasticsearch:
      condition: service_healthy
    kinotic-migration:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "/workspace/health-check"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 120s
  stdin_open: true # docker run -i
  tty: true        # docker run -t
  deploy:
    resources:
      reservations:
        memory: 4G
      limits:
        memory: 4G
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-kinotic-server-environment: &kinotic-server-environment
  BPL_JVM_HEAD_ROOM: 10
  # The --add-exports=jdk.compiler/* flags would only matter for the HFT (Chronicle Map)
  # secret-storage backend, which needs runtime codegen. The Paketo bootBuildImage produces
  # a JRE-only image without jdk.compiler, so those flags would be no-ops. Compose runs with
  # the in-memory backend (dev default) so codegen never happens. If you want to switch to
  # HFT, run from the IDE on a full JDK instead — see application-development.yml.
  JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=512m -javaagent:/workspace/BOOT-INF/classes/opentelemetry-javaagent.jar --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
  KINOTIC_MAX_OFF_HEAP_MEMORY: 419430400
  KINOTIC_DOMAIN_ELASTICCONNECTIONS_0_SCHEME: http
  KINOTIC_DOMAIN_ELASTICCONNECTIONS_0_HOST: kinotic-elasticsearch
  KINOTIC_DOMAIN_ELASTICCONNECTIONS_0_PORT: 9200
  KINOTIC_DOMAIN_EMAIL_ENABLED: "false"
  # The servers find each other over this static address list and form one Ignite cluster
  KINOTIC_IGNITE_DISCOVERYTYPE: LOCAL
  KINOTIC_IGNITE_LOCALADDRESSES: kinotic-org-server:47500,kinotic-system-server:47500,kinotic-app-server:47500
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  # jvm.buffer.* and jvm.system.cpu.* are Development-stability metrics the agent gates
  # behind this flag. Direct buffers matter here — Vert.x and Netty allocate off-heap
  # against MaxDirectMemorySize.
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_EMIT_EXPERIMENTAL_TELEMETRY: "true"
  # Names the bare PUT/GET transport spans under each Elasticsearch call, which otherwise
  # carry only an HTTP method in the waterfall.
  OTEL_INSTRUMENTATION_COMMON_PEER_SERVICE_MAPPING: "kinotic-elasticsearch:9200=elasticsearch"
  SPRING_PROFILES_ACTIVE: development,compose
  THC_PATH: /health # THC defaults to "/", which 404s; the api-gateway only mounts /health

services:
  kinotic-org-server:
    <<: *kinotic-server
    container_name: kinotic-org-server
    image: kinoticai/kinotic-org-server:${kinoticVersion:-5.0.0-SNAPSHOT}
    ports:
      - "127.0.0.1:9090:9090" # The portal
      - "127.0.0.1:58503:58503" # REST and STOMP
    environment:
      <<: *kinotic-server-environment
      KINOTIC_MANAGEMENTAPI_LOKIURL: http://loki:3100
      KINOTIC_MANAGEMENTAPI_TEMPOURL: http://tempo:3200
      KINOTIC_MANAGEMENTAPI_MIMIRURL: http://mimir:9009
      KINOTIC_APIGATEWAY_WEBSERVER_PORT: 9090
      KINOTIC_DOMAIN_APPBASEURL: "http://localhost:9090"
      OTEL_SERVICE_NAME: kinotic-org-server
      OTEL_RESOURCE_ATTRIBUTES: service.name=kinotic-org-server
      THC_PORT: 58503 # Paketo health-check probe — health endpoint is mounted on the api-gateway router

  kinotic-system-server:
    <<: *kinotic-server
    container_name: kinotic-system-server
    image: kinoticai/kinotic-system-server:${kinoticVersion:-5.0.0-SNAPSHOT}
    ports:
      - "127.0.0.1:58504:58504" # REST and STOMP
    environment:
      <<: *kinotic-server-environment
      KINOTIC_MANAGEMENTAPI_LOKIURL: http://loki:3100
      KINOTIC_MANAGEMENTAPI_TEMPOURL: http://tempo:3200
      KINOTIC_MANAGEMENTAPI_MIMIRURL: http://mimir:9009
      OTEL_SERVICE_NAME: kinotic-system-server
      OTEL_RESOURCE_ATTRIBUTES: service.name=kinotic-system-server
      THC_PORT: 58504

  kinotic-app-server:
    <<: *kinotic-server
    container_name: kinotic-app-server
    image: kinoticai/kinotic-app-server:${kinoticVersion:-5.0.0-SNAPSHOT}
    ports:
      - "127.0.0.1:58505:58505" # REST and STOMP
    environment:
      <<: *kinotic-server-environment
      OTEL_SERVICE_NAME: kinotic-app-server
      OTEL_RESOURCE_ATTRIBUTES: service.name=kinotic-app-server
      THC_PORT: 58505
