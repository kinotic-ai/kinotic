# The three Kinotic servers, one Ignite cluster: kinotic-server-management (the portal and the org API),
# kinotic-server-system (the platform's own API) and kinotic-server-app (every application's API).

# What every server container shares; each service below adds its image, ports and identity.
x-kinotic-server: &kinotic-server
  # Matches kinotic-migration: a locally present image wins, so CI can point the stack at the
  # image built from this commit by tagging it here. Run `docker compose pull` to refresh from
  # Docker Hub.
  pull_policy: missing
  depends_on:
    kinotic-elasticsearch:
      condition: service_healthy
    kinotic-migration:
      condition: service_completed_successfully
    openfga-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "/workspace/health-check"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 120s
  stdin_open: true # docker run -i
  tty: true        # docker run -t
  deploy:
    resources:
      reservations:
        memory: 2G
      limits:
        memory: 2G
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-kinotic-server-environment: &kinotic-server-environment
  BPL_JVM_HEAD_ROOM: 10
  # The direct-memory and Ignite off-heap caps are sized for the 2G container: direct memory measures flat
  # at about 10 MB whatever the connection count, and Ignite off-heap about 1 KB per connection
  JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=256m -javaagent:/workspace/BOOT-INF/classes/opentelemetry-javaagent.jar --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED
  KINOTIC_MAX_OFF_HEAP_MEMORY: 134217728
  KINOTIC_DOMAIN_ELASTICCONNECTIONS_0_SCHEME: http
  KINOTIC_DOMAIN_ELASTICCONNECTIONS_0_HOST: kinotic-elasticsearch
  KINOTIC_DOMAIN_ELASTICCONNECTIONS_0_PORT: 9200
  # The authorization engine, whose platform store openfga-init created
  KINOTIC_AUTHZ_APIURL: http://openfga:8080
  KINOTIC_DOMAIN_EMAIL_ENABLED: "false"
  # The servers find each other over this static address list and form one Ignite cluster
  KINOTIC_IGNITE_DISCOVERYTYPE: LOCAL
  KINOTIC_IGNITE_LOCALADDRESSES: kinotic-server-management:47500,kinotic-server-system:47500,kinotic-server-app:47500
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  # jvm.buffer.* and jvm.system.cpu.* are Development-stability metrics the agent gates
  # behind this flag. Direct buffers matter here — Vert.x and Netty allocate off-heap
  # against MaxDirectMemorySize.
  OTEL_INSTRUMENTATION_RUNTIME_TELEMETRY_EMIT_EXPERIMENTAL_TELEMETRY: "true"
  # Names the bare PUT/GET transport spans under each Elasticsearch call, which otherwise
  # carry only an HTTP method in the waterfall.
  OTEL_INSTRUMENTATION_COMMON_PEER_SERVICE_MAPPING: "kinotic-elasticsearch:9200=elasticsearch"
  SPRING_PROFILES_ACTIVE: development,compose
  THC_PATH: /health # THC defaults to "/", which 404s; the api-gateway only mounts /health

services:
  kinotic-server-management:
    <<: *kinotic-server
    container_name: kinotic-server-management
    image: kinoticai/kinotic-server-management:${kinoticVersion:-5.0.0-SNAPSHOT}
    ports:
      - "127.0.0.1:9090:9090" # The portal
      - "127.0.0.1:58503:58503" # REST and STOMP
    environment:
      <<: *kinotic-server-environment
      KINOTIC_MANAGEMENTAPI_LOKIURL: http://loki:3100
      KINOTIC_MANAGEMENTAPI_TEMPOURL: http://tempo:3200
      KINOTIC_MANAGEMENTAPI_MIMIRURL: http://mimir:9009
      KINOTIC_APIGATEWAY_WEBSERVER_PORT: 9090
      OTEL_SERVICE_NAME: kinotic-server-management
      OTEL_RESOURCE_ATTRIBUTES: service.name=kinotic-server-management,service.instance.id=kinotic-server-management
      THC_PORT: 58503 # Paketo health-check probe — health endpoint is mounted on the api-gateway router
    volumes:
      # The developer's tunnel origin and GitHub App (dev-tools/github-app/dev-github-app.ts).
      # Spring loads ./config/application.yml from the working directory, /workspace, above every
      # packaged file, so it replaces application-compose.yml's localhost:9090 origin
      - ${HOME}/.kinotic/dev-environment/kinotic-server-management:/workspace/config:ro

  kinotic-server-system:
    <<: *kinotic-server
    container_name: kinotic-server-system
    image: kinoticai/kinotic-server-system:${kinoticVersion:-5.0.0-SNAPSHOT}
    ports:
      - "127.0.0.1:58504:58504" # REST and STOMP
    environment:
      <<: *kinotic-server-environment
      KINOTIC_MANAGEMENTAPI_LOKIURL: http://loki:3100
      KINOTIC_MANAGEMENTAPI_TEMPOURL: http://tempo:3200
      KINOTIC_MANAGEMENTAPI_MIMIRURL: http://mimir:9009
      OTEL_SERVICE_NAME: kinotic-server-system
      OTEL_RESOURCE_ATTRIBUTES: service.name=kinotic-server-system,service.instance.id=kinotic-server-system
      THC_PORT: 58504
    volumes:
      # The developer's GitHub App (dev-tools/github-app/dev-github-app.ts), with which this server
      # mints the tokens deployments fetch their repositories with; Spring loads it as
      # ./config/application.yml
      - ${HOME}/.kinotic/dev-environment/kinotic-server-system:/workspace/config:ro

  kinotic-server-app:
    <<: *kinotic-server
    container_name: kinotic-server-app
    image: kinoticai/kinotic-server-app:${kinoticVersion:-5.0.0-SNAPSHOT}
    ports:
      - "127.0.0.1:58505:58505" # REST and STOMP
    environment:
      <<: *kinotic-server-environment
      OTEL_SERVICE_NAME: kinotic-server-app
      OTEL_RESOURCE_ATTRIBUTES: service.name=kinotic-server-app,service.instance.id=kinotic-server-app
      THC_PORT: 58505
