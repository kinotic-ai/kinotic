services:
  kinotic-migration:
    container_name: kinotic-migration
    pull_policy: missing
    image: kinoticai/kinotic-migration:${kinoticVersion:-5.0.0-SNAPSHOT}
    depends_on:
      kinotic-elasticsearch:
        condition: service_healthy
    environment:
      KINOTIC_MIGRATION_ELASTIC_SCHEME: http
      KINOTIC_MIGRATION_ELASTIC_HOST: kinotic-elasticsearch
      KINOTIC_MIGRATION_ELASTIC_PORT: 9200
      # compose.yml runs the demonstration through demonstration.env, compose.sample-data.yml adds `fixtures`, and
      # compose.kinotic-e2e-test.yml runs `e2e`; the integration tests' compose.kinotic-test.yml takes the default
      SPRING_PROFILES_ACTIVE: ${KINOTIC_MIGRATION_PROFILES:-test}