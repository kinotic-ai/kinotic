services:
  kinotic-migration:
    container_name: kinotic-migration
    pull_policy: missing
    image: kinoticai/kinotic-migration:${kinoticVersion:-5.0.0-SNAPSHOT}
    depends_on:
      kinotic-elasticsearch:
        condition: service_healthy
    environment:
      KINOTIC_MIGRATION_ELASTIC_SCHEME: http
      KINOTIC_MIGRATION_ELASTIC_HOST: kinotic-elasticsearch
      KINOTIC_MIGRATION_ELASTIC_PORT: 9200
      # compose.yml adds `fixtures` through evaluation.env, seeding sample data for evaluators;
      # the test stacks include this file without it
      SPRING_PROFILES_ACTIVE: ${KINOTIC_MIGRATION_PROFILES:-development,compose}