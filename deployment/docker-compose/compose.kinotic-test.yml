# Minimal compose for the kinotic-test integration tests: Elasticsearch + migration (no Kibana, OTEL, or server).
# No service overrides here: redefining an included service ("conflicts with imported resource") fails on
# older Docker Compose (the CI runner). The ES data volume is a named volume in compose.elasticsearch.yml,
# cleared by `down -v` between runs.
include:
  - compose.elasticsearch.yml
  - compose.kinotic-migration.yml
