# Azure production values for the load-generator chart.
# Connects directly to the org server's internal service (cluster-internal). The pods serve TLS
# even cluster-internally, under the cluster certificate's public names.

kinotic:
  useSsl: true
  tlsInsecure: true
  host: kinotic-org-server-internal
  port: 58503

loadGenerator:
  image:
    tag: latest
    pullPolicy: Always
  config:
    maxConcurrentRequests: 1
    maxRequestsPerSecond: 100
    testName: generateComplexEntities
    beginTenantIdNumber: 1
    numberOfTenants: 1

otel:
  type: NONE

parallelism: 1
