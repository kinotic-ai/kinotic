# General properties shared by all profiles
kinotic:
  domain:
    oauth:
      # Clients permitted to start an authorization-code flow, by Client ID Metadata Document URL.
      # Listing any client closes the endpoint to every client not listed.
      allowedClientIds:
        # Claude Code
        - https://claude.ai/oauth/claude-code-client-metadata
        # Claude web, desktop, and mobile custom connectors
        - https://claude.ai/oauth/mcp-oauth-client-metadata
  managementApi:
    github:
      appId: 3584018
      appSlug: kinotic-ai
      repoTemplate: kinotic-ai/kinotic-tpl-isomorphic-ts
  apiGateway:
    # Off the org server's 58503, so the servers run side by side on one machine
    stompPort: 58504
    # The system console is served from its own static hosting, never from a server
    webServer:
      enabled: false


logging:
  level:
    com:
      kinotic: INFO
