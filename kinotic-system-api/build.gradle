plugins {
    id 'org.kinotic.java-library-conventions'
}


dependencies {
    implementation project(':kinotic-core')
    implementation project(':kinotic-domain')
    implementation project(':kinotic-grind')
    implementation project(':kinotic-management-api')

    implementation 'io.projectreactor:reactor-core'

    implementation 'org.apache.ignite:ignite-core'

    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'io.vertx:vertx-core'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // the factory test runs the grind engine with an in-memory JobRunRepository subclass,
    // whose ES-backed superclass needs the client types at compile time
    testImplementation 'co.elastic.clients:elasticsearch-java'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'tools.jackson.core:jackson-databind'
}
