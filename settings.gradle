rootProject.name = 'kinotic'

// When CLAUDE_CLOUD_COMPILE=true, exclude the JS-building projects to avoid resolving node-gradle plugin
def skipNodeProjects = Boolean.parseBoolean(System.getenv('CLAUDE_CLOUD_COMPILE'))
def nodeProjects = ['kinotic-frontend', 'kinotic-spawn-renderer']

rootDir.listFiles().each {
    if (it.directory && new File(it, 'settings.gradle').exists()) {
        if (skipNodeProjects && nodeProjects.contains(it.name)) {
            return // skip
        }
        include ":${it.name}"
    }
}

