plugins {
    id 'org.kinotic.java-library-conventions'
}

dependencies {
    implementation project(':kinotic-core')
    implementation project(':kinotic-domain')
    implementation project(':kinotic-os-api')

    implementation 'io.vertx:vertx-core'
    implementation 'io.vertx:vertx-web'
    implementation 'io.vertx:vertx-web-client'

    implementation 'co.elastic.clients:elasticsearch-java'

    implementation 'org.apache.ignite:ignite-core'

    implementation 'io.jsonwebtoken:jjwt-api'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson'

    implementation 'com.github.ben-manes.caffeine:caffeine'

    implementation "com.github.slugify:slugify:${slugifyVersion}"

    implementation 'org.springframework:spring-core'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'tools.jackson.core:jackson-core'
    implementation 'tools.jackson.core:jackson-databind'

    implementation "org.graalvm.polyglot:polyglot:${graalvmPolyglotVersion}"
    runtimeOnly "org.graalvm.polyglot:js-community:${graalvmPolyglotVersion}"
}

// GraalJsSpawnRenderer executes the published @kinotic-ai/spawn npm package.
// Its GraalJS bundle (dist/spawn-renderer.global.js) is fetched from the npm
// registry as an ordinary dependency and extracted onto the classpath, so the
// engine version the server runs is the pin below, not repo source.
repositories {
    ivy {
        url = uri('https://registry.npmjs.org')
        patternLayout { artifact '[organisation]/[module]/-/[module]-[revision].[ext]' }
        // npm serves no ivy.xml; resolve by artifact presence alone
        metadataSources { artifact() }
        content { includeGroup '@kinotic-ai' }
    }
}

configurations {
    spawnRenderer
}

dependencies {
    spawnRenderer "@kinotic-ai:spawn:${kinoticSpawnVersion}@tgz"
}

tasks.register('extractSpawnRenderer', Copy) {
    from({ tarTree(resources.gzip(configurations.spawnRenderer.singleFile)) }) {
        include 'package/dist/spawn-renderer.global.js'
        eachFile { it.path = 'spawn/spawn-renderer.js' }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('spawn-renderer')
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('spawn-renderer'))

tasks.named('processResources') {
    dependsOn 'extractSpawnRenderer'
}
