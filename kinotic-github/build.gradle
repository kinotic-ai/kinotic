plugins {
    id 'org.kinotic.java-library-conventions'
}

dependencies {
    implementation project(':kinotic-github-api')
    implementation project(':kinotic-core')
    implementation project(':kinotic-domain')
    implementation project(':kinotic-os-api')

    implementation 'io.vertx:vertx-core'
    implementation 'io.vertx:vertx-web'
    implementation 'io.vertx:vertx-web-client'

    implementation 'io.projectreactor:reactor-core'

    implementation 'co.elastic.clients:elasticsearch-java'

    implementation 'org.apache.ignite:ignite-core'

    implementation 'io.jsonwebtoken:jjwt-api'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson'

    implementation 'com.github.ben-manes.caffeine:caffeine'

    implementation 'org.apache.commons:commons-compress'

    implementation "com.github.slugify:slugify:${slugifyVersion}"

    implementation 'org.springframework:spring-core'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'tools.jackson.core:jackson-core'
    implementation 'tools.jackson.core:jackson-databind'

    implementation "org.graalvm.polyglot:polyglot:${graalvmPolyglotVersion}"
    runtimeOnly "org.graalvm.polyglot:js-community:${graalvmPolyglotVersion}"

    testImplementation 'org.mockito:mockito-core'
}

// GraalJsSpawnRenderer executes the published @kinotic-ai/spawn npm package.
// Its GraalJS bundle (dist/graal-spawn-renderer.js) is fetched from the npm registry
// as an ordinary dependency and extracted onto the classpath, so the engine
// version the server runs is the pin below, not repo source.
repositories {
    ivy {
        url = uri('https://registry.npmjs.org')
        patternLayout { artifact '[organisation]/[module]/-/[module]-[revision].[ext]' }
        // npm serves no ivy.xml; resolve by artifact presence alone
        metadataSources { artifact() }
        content { includeGroup '@kinotic-ai' }
    }
}

configurations {
    spawnRenderer
}

dependencies {
    spawnRenderer "@kinotic-ai:spawn:${kinoticSpawnVersion}@tgz"
}

def extractSpawnRenderer = tasks.register('extractSpawnRenderer', Copy) {
    from({ tarTree(resources.gzip(configurations.spawnRenderer.singleFile)) }) {
        include 'package/dist/graal-spawn-renderer.js'
        eachFile { it.path = 'spawn/graal-spawn-renderer.js' }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('spawn-renderer')
}

// These resources are generated by extractSpawnRenderer, so readers must run after it.
sourceSets.main.resources.srcDir(extractSpawnRenderer)

// A provisioned project pins the @kinotic-ai npm packages through spawn globals
// ({{ kinoticCoreVersion }} and friends). GitHubProjectRepoProvisioner supplies those
// globals from this projection of the kinotic-js package.json files, so bumping a
// package there is the only edit a newly provisioned project needs — no Java constant
// to chase and no template change. Templates keep declaring the globals in spawn.json,
// which keeps `kinotic spawn lint` clean and gives the CLI a value; the server's
// context wins over that default at render time.
//
// The global name drops the @kinotic-ai scope and a kinotic- prefix on the package
// name, so @kinotic-ai/os-api becomes kinoticOsApiVersion and @kinotic-ai/kinotic-cli
// becomes kinoticCliVersion rather than kinoticKinoticCliVersion.
def npmPackageVersions = tasks.register('npmPackageVersions') {
    def packageJsonFiles = files(rootProject.file('kinotic-js/kinotic-cli/package.json')) +
                           fileTree(rootProject.file('kinotic-js/workspace/packages')) { include '*/package.json' }
    def outputDir = layout.buildDirectory.dir('npm-package-versions')

    inputs.files(packageJsonFiles).withPropertyName('packageJsonFiles')
    outputs.dir(outputDir)

    doLast {
        def versions = new TreeMap<String, String>()
        packageJsonFiles.each { File packageJson ->
            def pkg = new groovy.json.JsonSlurper().parse(packageJson)
            def unscoped = ((String) pkg.name) - ~'^@[^/]+/' - ~'^kinotic-'
            def camelCased = unscoped.replaceAll(/-(.)/) { it[1].toUpperCase() }
            versions.put("kinotic${camelCased.capitalize()}Version".toString(), "^${pkg.version}".toString())
        }
        def target = outputDir.get().file('spawn/npm-package-versions.properties').asFile
        target.parentFile.mkdirs()
        target.text = versions.collect { name, range -> "$name=$range" }.join('\n') + '\n'
    }
}

sourceSets.main.resources.srcDir(npmPackageVersions)
