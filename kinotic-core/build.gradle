plugins {
    id 'org.kinotic.java-library-conventions'
}

dependencies {
    // api scope: idl types (ServiceDefinition, C3Type) appear in core's public directory API
    api project(':kinotic-idl')

    // supplies the configurable Jackson 3 codec for Vert.x JSON; KinoticVertxConfig installs the
    // Spring-managed mapper into it
    implementation 'org.kinotic:vertx-jackson3-codec'

    implementation "com.github.ben-manes.caffeine:caffeine"
    implementation 'commons-io:commons-io'

    implementation 'io.jsonwebtoken:jjwt-api'
    implementation 'io.jsonwebtoken:jjwt-impl'
    implementation 'io.jsonwebtoken:jjwt-jackson'

    implementation 'io.projectreactor:reactor-core'

    implementation 'io.vertx:vertx-core'
    implementation 'io.vertx:vertx-reactive-streams'
    implementation 'io.vertx:vertx-auth-common'
    implementation 'io.vertx:vertx-auth-oauth2'
    implementation 'io.vertx:vertx-ignite'
    implementation 'io.vertx:vertx-web'
    implementation 'io.vertx:vertx-web-client'

    // XXHash128 for minting MCP tool names
    implementation 'net.openhft:zero-allocation-hashing'

    // Apache Ignite
    implementation 'org.apache.ignite:ignite-core'
    implementation 'org.apache.ignite:ignite-calcite'
    implementation 'org.apache.ignite:ignite-kubernetes' // support for kubernetes discovery
    implementation 'org.apache.ignite:ignite-spring'
    implementation 'org.apache.ignite:ignite-slf4j'

    implementation 'org.reactivestreams:reactive-streams'

    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework.boot:spring-boot-jackson'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework:spring-aop'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-core'
    implementation 'org.springframework:spring-web' // used for json conversion functionality spring web has a lot of helpful utilities

    // jackson impl
    implementation 'tools.jackson.core:jackson-core'
    implementation 'tools.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    // Collects the spans ServiceInvocationSupervisor produces, in place of the agent's SDK
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
}
