  # YAML Reference http://www.yaml.org/refcard.html
  continuum:
    debug: true
    disableClustering: false
    cluster:
      discoveryType: SHAREDFS
      joinTimeoutMs: 0
      discoveryPort: 47500
      communicationPort: 47501
      sharedFsPath: /tmp/structures-sharedfs
      kubernetesNamespace: default
      kubernetesServiceName: structures
      kubernetesIncludeNotReadyAddresses: false

  kinotic:
    secret-storage:
      # Dummy Base64-encoded key for tests only; lets SecretNameDeriver start in the test context.
      master-key: a2lub3RpYy10ZXN0LW1hc3Rlci1rZXktZHVtbXktMDA=

  logging:
    level:
      org:
        kinotic: DEBUG
      io:
        vertx: DEBUG
