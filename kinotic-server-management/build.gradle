plugins {
	id 'org.kinotic.server-conventions'
}

dependencies {
	implementation project(':kinotic-authz')
	implementation project(':kinotic-core')
	implementation project(':kinotic-domain')
	implementation project(':kinotic-ee')
	implementation project(':kinotic-management-api')
	implementation project(':kinotic-api-gateway')

	implementation 'io.vertx:vertx-core'
	implementation 'io.vertx:vertx-web'
	implementation 'io.vertx:vertx-web-client'

	implementation 'org.springframework.boot:spring-boot-starter-validation'
}
