# The development server's management server: kinotic-server-management as a container on one Proxmox host
# beside three Elasticsearch nodes and the observability stack (deployment/terraform/proxmox),
# with the sites storage account, email, and a Key Vault in Azure and the sites Worker on
# Cloudflare (deployment/terraform/azure/dev-server). Activated as `dev-server`. Holds what is
# fixed for this shape of deployment; everything that differs per server — hostnames,
# endpoints, addresses — arrives through the environment the terraform root composes, and
# the credentials through the file imported below.
spring:
  config:
    # The secret-storage master key and the GitHub App's key and webhook secret, placed on
    # the host by sync-secrets.sh and mounted read-only
    import: optional:file:/etc/kinotic/secrets.yml
kinotic:
  managementServer:
    turnstile:
      # Cloudflare's always-passing test site: the development server has no Turnstile
      # site of its own, so the find-my-organizations form renders the widget and every token verifies
      siteKey: 1x00000000000000000000AA
      secretKey: 1x0000000000000000000000000000000AA
  managementApi:
    entityDefinition:
      # Three master-eligible data nodes, one physical disk each: one replica survives a disk,
      # and one shard per index keeps a published EntityDefinition cheap against the
      # 1000-shard-per-node ceiling. The production defaults (3 and 2) assume a larger cluster.
      numberOfShards: 1
      numberOfReplicas: 1
  apiGateway:
    ssl:
      # certbot's certificate for the management server's hostname, mounted from the host; Vert.x
      # terminates TLS, and the edge passes each connection through unopened
      enabled: true
      certPath: /etc/kinotic/certs/fullchain.pem
      keyPath: /etc/kinotic/certs/privkey.pem
  cors:
    # The portal and the trusted UIs (trusted_ui_hostnames in the dev-server terraform root)
    allowedOriginPattern: "https:\\/\\/(${DEV_SERVER_MANAGEMENT_UI_HOSTNAMES})"
    allowCredentials: true
  domain:
    systemSecrets:
      # Generated once when the server is built (generate-secrets.sh in deployment/terraform/proxmox):
      # an activeKeyId and a keys list, so a key can be added to the set at migration time
      jwtSigningKeysPath: /etc/kinotic/platform-secrets/jwt-signing-keys
    secretStorage:
      # The in-memory default loses every stored secret on restart; the Key Vault the
      # dev-server terraform root creates keeps them, and keeps them in Azure for migration.
      # The master key SecretNameDeriver derives storage names with comes from secrets.yml.
      backend: AZURE
