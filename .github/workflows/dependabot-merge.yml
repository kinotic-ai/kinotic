name: Dependabot Merge

# Merges each open Dependabot pull request into develop once a GitHub Actions check has succeeded on
# it and no check has failed or is still running, so a security fix lands, and its Dependabot alert
# closes, without anyone acting on it. A pull request with a failed check that is behind develop is
# asked to rebase, once per commit to develop, so a failure develop caused and has since fixed clears
# without anyone acting on it. A pull request with a failed check while up to date with develop, that
# Dependabot has not rebased six hours after it was asked, with no successful or running GitHub
# Actions check a day after it was opened, or that GitHub refuses to merge, is assigned to OWNER: the
# cases that need a person.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

concurrency:
  group: dependabot-merge

env:
  OWNER: NavidMitchell

jobs:
  merge:
    name: Merge passing Dependabot pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Merge or assign
        run: |
          assign() { gh api -X POST "repos/$REPO/issues/$1/assignees" -f "assignees[]=$OWNER" > /dev/null; }
          day_ago=$(date -u -d '-1 day' +%Y-%m-%dT%H:%M:%SZ)
          six_hours_ago=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)
          develop_at=$(gh api "repos/$REPO/commits/develop" --jq '.commit.committer.date')
          gh api "repos/$REPO/pulls?state=open&base=develop&per_page=100" --paginate \
            --jq '.[] | select(.user.login == "dependabot[bot]") | [.number, .head.sha, .created_at] | @tsv' |
          while IFS=$'\t' read -r pr sha created; do
            runs=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | [.app.slug, (.conclusion // "pending")] | @tsv')
            # Other apps' checks (CodeRabbit, code scanning) gate on a failure but build nothing, and their
            # cancelled or skipped runs say nothing about the change
            if grep -qP '\tfailure$|^github-actions\t(cancelled|timed_out|action_required|stale)$' <<<"$runs"; then
              behind=$(gh api "repos/$REPO/compare/develop...$sha" --jq '.behind_by')
              asked=$(gh api "repos/$REPO/issues/$pr/comments?per_page=100" --paginate \
                --jq '.[] | select(.user.login == "github-actions[bot]" and .body == "@dependabot rebase") | .created_at' | tail -n 1)
              if (( behind == 0 )); then
                echo "#$pr: a check failed on the current develop, assigning $OWNER"
                assign "$pr"
              elif [[ -z "$asked" || "$asked" < "$develop_at" ]]; then
                echo "#$pr: a check failed $behind commits behind develop, asking Dependabot to rebase"
                gh api -X POST "repos/$REPO/issues/$pr/comments" -f body='@dependabot rebase' > /dev/null
              elif [[ "$asked" < "$six_hours_ago" ]]; then
                echo "#$pr: Dependabot has not rebased since it was asked at $asked, assigning $OWNER"
                assign "$pr"
              else
                echo "#$pr: waiting for Dependabot to rebase"
              fi
            elif grep -qP '^github-actions\tpending$' <<<"$runs"; then
              echo "#$pr: workflows still running"
            elif ! grep -qP '^github-actions\tsuccess$' <<<"$runs" && [[ "$created" < "$day_ago" ]]; then
              echo "#$pr: no workflow built it, assigning $OWNER"
              assign "$pr"
            elif ! grep -qP '^github-actions\tsuccess$' <<<"$runs"; then
              echo "#$pr: no workflow has built it yet"
            elif grep -qP '\tpending$' <<<"$runs"; then
              echo "#$pr: checks still running"
            else
              echo "#$pr: all checks passed, merging"
              # sha makes the merge fail rather than take a commit pushed after the checks ran
              if ! gh api -X PUT "repos/$REPO/pulls/$pr/merge" -f merge_method=squash -f sha="$sha" > /dev/null; then
                echo "::warning::#$pr could not be merged, assigning $OWNER"
                assign "$pr"
              fi
            fi
          done
