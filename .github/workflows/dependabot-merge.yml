name: Dependabot Merge

# Merges each open Dependabot pull request into develop once every check on it has passed, so a
# security fix lands, and its Dependabot alert closes, without anyone acting on it. A pull request
# with a failed check, with no checks a day after it was opened, or that GitHub refuses to merge, is
# assigned to OWNER: the cases that need a person.
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

concurrency:
  group: dependabot-merge

env:
  OWNER: NavidMitchell

jobs:
  merge:
    name: Merge passing Dependabot pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Merge or assign
        run: |
          assign() { gh api -X POST "repos/$REPO/issues/$1/assignees" -f "assignees[]=$OWNER" > /dev/null; }
          day_ago=$(date -u -d '-1 day' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/$REPO/pulls?state=open&base=develop&per_page=100" --paginate \
            --jq '.[] | select(.user.login == "dependabot[bot]") | [.number, .head.sha, .created_at] | @tsv' |
          while IFS=$'\t' read -r pr sha created; do
            runs=$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | .conclusion // "pending"')
            if [[ -z "$runs" && "$created" < "$day_ago" ]]; then
              echo "#$pr: no checks ran on it, assigning $OWNER"
              assign "$pr"
            elif [[ -z "$runs" ]]; then
              echo "#$pr: no checks yet"
            elif grep -qE '^(failure|cancelled|timed_out|action_required|stale)' <<<"$runs"; then
              echo "#$pr: a check failed, assigning $OWNER"
              assign "$pr"
            elif grep -q '^pending' <<<"$runs"; then
              echo "#$pr: checks still running"
            else
              echo "#$pr: all checks passed, merging"
              # sha makes the merge fail rather than take a commit pushed after the checks ran
              if ! gh api -X PUT "repos/$REPO/pulls/$pr/merge" -f merge_method=squash -f sha="$sha" > /dev/null; then
                echo "::warning::#$pr could not be merged, assigning $OWNER"
                assign "$pr"
              fi
            fi
          done
