name: Workload Runner Docker Build

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'kinotic-js/workload-runner/**'

jobs:
  build_and_publish:
    name: Build and Publish Workload Runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./kinotic-js/workload-runner
          push: true
          platforms: linux/amd64,linux/arm64
          tags: kinoticai/workload-runner:latest
          cache-from: type=registry,ref=kinoticai/workload-runner:buildcache
          cache-to: type=registry,ref=kinoticai/workload-runner:buildcache,mode=max

      - name: Add status to Commit
        uses: guibranco/github-status-action-v2@v1.2.4
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: 'Workload Runner Docker Build'
          description: 'Docker image built and published successfully'
          state: 'success'
          sha: ${{ github.sha }}
