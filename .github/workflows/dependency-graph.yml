name: Dependency Graph

# Submits the resolved Gradle dependencies to GitHub's dependency graph, which reads no Gradle build
# files on its own. With them in the graph the Java libraries appear under Insights > Dependency graph
# and their known vulnerabilities raise Dependabot alerts on the Security tab.
on:
  push:
    branches:
      - develop
    paths:
      - '**/*.gradle'
      - 'gradle.properties'
      - 'buildSrc/**'
      - 'gradle/**'
  workflow_dispatch:

concurrency:
  group: dependency-graph
  cancel-in-progress: true

jobs:
  submit:
    name: Submit Gradle dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v6
