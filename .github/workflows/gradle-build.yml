name: Build and Publish

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - 'helm/**'
      - 'docker-compose/**'
      - 'kinotic-js/**'
      - 'webdocs/**' 
      - 'website/**'

jobs:
  gradle_build_and_publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 25
          gpg-private-key: ${{ secrets.GPG_KEY_NEW }}
          gpg-passphrase: ${{ secrets.GPG_KEY_PASS_NEW }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 1: build + test the migration toolchain, then publish the kinotic-migration image.
      # kinotic-test (in the main build below) starts a compose stack that pulls
      # kinoticai/kinotic-migration:<version>, so the image must exist first. The `&&` publishes
      # the image only if kinotic-sql and kinotic-migration tests pass.
      - name: Build & test kinotic-sql + kinotic-migration, publish migration image
        id: migration
        continue-on-error: true
        run: ./gradlew :kinotic-sql:build :kinotic-migration:build && ./gradlew :kinotic-migration:bootBuildImage --publishImage
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # Step 2: build and test everything else. kinotic-test pulls the migration image published above.
      - name: Build with Gradle
        id: gradle_build
        if: ${{ steps.migration.outcome == 'success' }}
        continue-on-error: true
        run: ./gradlew build

      # All library Maven artifacts publish once here (applications publish images, not jars), so
      # kinotic-sql deploys with the rest — no separate/duplicate deploy.
      - name: Publish to Maven Central with JReleaser
        if: ${{ steps.migration.outcome == 'success' && steps.gradle_build.outcome == 'success' }}
        run: ./gradlew publish && ./gradlew jreleaserDeploy --info
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_TOKEN_USERNAME }}
          JRELEASER_MAVENCENTRAL_TOKEN: ${{ secrets.MAVEN_TOKEN_PASSWORD }}
          JRELEASER_NEXUS2_USERNAME: ${{ secrets.MAVEN_TOKEN_USERNAME }}
          JRELEASER_NEXUS2_TOKEN: ${{ secrets.MAVEN_TOKEN_PASSWORD }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_KEY_NEW }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_KEY_PASS_NEW }}

      # The migration image was published in step 1; this publishes the remaining application image.
      - name: Publish kinotic-server image to Docker Hub
        if: ${{ steps.migration.outcome == 'success' && steps.gradle_build.outcome == 'success' }}
        run: ./gradlew :kinotic-server:bootBuildImage --publishImage
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Run E2E Tests
        id: run_e2e_tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          cd kinotic-js/e2e-tests
          gradle pnpmInstall
          gradle pnpmTest

      # Aggregate Allure results from every module into one directory: the Java suites (allure-junit5)
      # and the JS e2e suite (allure-vitest) each write their own allure-results. Find them wherever
      # they land, skipping node_modules and the aggregate directory itself.
      - name: Merge Test Results
        if: ${{ !cancelled() }}
        run: |
          mkdir -p allure-results
          find . -type d -name allure-results \
               -not -path './allure-results' \
               -not -path '*/node_modules/*' -print0 \
          | while IFS= read -r -d '' dir; do
              cp -a "$dir/." allure-results/ 2>/dev/null || true
            done

      # Hand the merged results to the publish_test_report job, which runs on a separate runner.
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore
          retention-days: 7

  # Publishing the Allure report is split into its own job so the gh-pages serialization
  # (concurrency below) covers only the gh-pages push, not the heavy build/publish job above —
  # which keeps its cancel-previous-run behavior. The shared group string couples this job with
  # the website deploy in website-deploy.yml so the two never push to gh-pages concurrently.
  publish_test_report:
    name: Publish Allure Report
    needs: gradle_build_and_publish
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results
          path: allure-results

      - name: Get Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.13
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          subfolder: allure
          allure_report: allure-report
          allure_history: allure-history

      # Stable, crawler-safe entry point. /allure/ redirects to the newest run and is marked
      # noindex, so it is linkable from the site and README without exposing report pages to search
      # engines — unlike a root redirect, a redirect this deep carries no homepage SEO cost.
      - name: Write latest-report redirect
        run: |
          mkdir -p allure-history/allure
          cat > allure-history/allure/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex">
            <meta http-equiv="refresh" content="0; url=./${{ github.run_number }}/">
            <title>Kinotic test reports</title>
          </head>
          <body>Redirecting to the latest <a href="./${{ github.run_number }}/">Allure report</a></body>
          </html>
          EOF

      - name: Deploy report to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages
          keep_files: true

      - name: Add status to Commit
        uses: guibranco/github-status-action-v2@v1.1.13
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: 'Test Report'
          description: 'Report published'
          state: 'success'
          sha: ${{ github.sha }}
          target_url: https://kinotic.ai/allure/${{ github.run_number }}
