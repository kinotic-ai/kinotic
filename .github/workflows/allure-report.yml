name: Publish Allure Report

# Triggered by the build rather than being a job inside it, so the ~50s report round-trip is not
# counted in the build's wall clock and a red build still publishes its report.
on:
  workflow_run:
    workflows: ["Build and Publish"]
    types: [completed]

# Shared group with website-deploy.yml prevents concurrent gh-pages pushes.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  actions: read       # download-artifact reaches into the triggering run
  contents: write     # push to gh-pages
  statuses: write     # report status back onto the built commit

jobs:
  publish_test_report:
    name: Publish Allure Report
    # Pull request runs are left out of the published history, which tracks develop and main. This job
    # also holds contents: write, so it never consumes artifacts a pull request's code produced.
    if: ${{ github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      # Allure 3 CLI version, pinned for reproducible report output and history handling.
      ALLURE_VERSION: "3.12.0"
      # Number of newest reports kept under test-results/, and the history depth passed to
      # `allure generate`. One number for both: the report folders retained on gh-pages and the
      # trend entries embedded in them describe the same window of runs.
      RETAINED_RUNS: "10"
      RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
    steps:
      # Sparse-checkout just allurerc.mjs (needed for historyPath). Must precede the download below,
      # since checkout cleans its destination.
      - name: Checkout report config
        uses: actions/checkout@v7
        with:
          sparse-checkout: allurerc.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # One artifact per job in the build (allure-results-build, -kinotic-test, -e2e, ...);
      # merge-multiple flattens them back into the single directory allure generate expects.
      - name: Download Allure results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Allure history
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # The deploy below replaces the whole branch (keep_files:false) so the prune step can actually
      # delete report folders — peaceiris only ever adds files when keep_files is true. Replacing
      # means the publish dir must start as a copy of what is already on gh-pages, or the website,
      # CNAME and .nojekyll would be dropped along with the stale reports.
      - name: Seed publish dir from current gh-pages
        run: |
          mkdir -p allure-history
          if [ -d gh-pages ] && [ -n "$(ls -A gh-pages 2>/dev/null)" ]; then
            rm -rf gh-pages/.git
            cp -a gh-pages/. allure-history/
          elif git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            # The checkout above is continue-on-error; seeding an empty publish dir from a failed
            # checkout would wipe the live site on deploy, so fail instead.
            echo "gh-pages exists but was not checked out; refusing to publish an empty branch." >&2
            exit 1
          fi

      # Allure 3 has no drop-in publish action, so do the history round-trip explicitly:
      #   1. restore the prior run's history.jsonl from gh-pages (absent on run 1),
      #   2. `allure generate` reads it (historyPath in allurerc.mjs), writes the report, appends this run,
      #   3. persist the newest RETAINED_RUNS entries for the next run.
      # Each run is an immutable folder under test-results/<run_number>/.
      - name: Generate Allure report
        run: |
          if [ ! -d allure-results ] || [ -z "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "No allure-results found; skipping report generation."
            exit 0
          fi
          if [ -f gh-pages/test-results/history.jsonl ]; then
            cp gh-pages/test-results/history.jsonl history.jsonl
          fi
          npx --yes "allure@${ALLURE_VERSION}" generate allure-results \
            --config allurerc.mjs \
            --history-limit "${RETAINED_RUNS}" \
            --output "allure-history/test-results/${RUN_NUMBER}"
          mkdir -p allure-history/test-results
          # --history-limit caps what generate reads back, but Allure only appends to history.jsonl
          # and never truncates it; drop the entries past the limit that nothing will read again.
          tail -n "${RETAINED_RUNS}" history.jsonl > allure-history/test-results/history.jsonl

      # Stable noindex entry point: /test-results/ redirects to the newest run, linkable without
      # exposing report pages to search engines.
      - name: Write latest-report redirect
        run: |
          # Relative redirect (host-agnostic for the kinotic.ai domain) to the newest run; mkdir
          # guarantees a target even if generate produced nothing.
          mkdir -p allure-history/test-results
          cat > allure-history/test-results/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex">
            <meta http-equiv="refresh" content="0; url=./${RUN_NUMBER}/">
            <title>Kinotic test reports</title>
          </head>
          <body>Redirecting to the latest <a href="./${RUN_NUMBER}/">Allure report</a></body>
          </html>
          EOF

      # The README's build badge. GitHub's own badge is fixed green/red, so the state is published
      # as a shields endpoint document in the brand's colors instead. It rides along with the report
      # because this workflow already runs after every build, red or green, and /test-results is the
      # one tree website-deploy folds back in when it replaces the branch. The prune below only
      # deletes numbered run folders, so the file survives it.
      #
      # Anything but a finished develop build leaves the published state standing: a cancelled run is
      # one a newer push superseded, and a main build would otherwise overwrite what the badge claims
      # about develop.
      - name: Write build badge
        if: ${{ github.event.workflow_run.head_branch == 'develop' }}
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          case "$CONCLUSION" in
            success) message=passing; color=28FEB4 ;;
            failure) message=failing; color=EC1F52 ;;
            *) echo "Triggering build was $CONCLUSION; leaving the published badge as it is."; exit 0 ;;
          esac
          mkdir -p allure-history/test-results
          cat > allure-history/test-results/build-badge.json <<EOF
          {
            "schemaVersion": 1,
            "label": "build",
            "message": "${message}",
            "color": "${color}",
            "labelColor": "171717"
          }
          EOF

      # Reports are immutable and never overwritten, so without a prune the branch grows without
      # bound: it reached 11 GB across 248 run folders, past the 10 GB artifact cap that
      # actions/deploy-pages enforces, and the Pages deployment started failing.
      - name: Prune stale reports
        run: |
          cd allure-history/test-results
          ls -1 | grep -xE '[0-9]+' | sort -rn | tail -n "+$((RETAINED_RUNS + 1))" | while read -r stale; do
            rm -rf "$stale"
          done

      - name: Deploy report to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages
          keep_files: false

      - name: Add status to Commit
        uses: guibranco/github-status-action-v2@v1.2.4
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: 'Test Report'
          description: 'Report published'
          state: 'success'
          sha: ${{ github.event.workflow_run.head_sha }}
          target_url: https://kinotic.ai/test-results/${{ github.event.workflow_run.run_number }}
