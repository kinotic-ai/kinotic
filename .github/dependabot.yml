# Keeps the workflow actions current, including the ones pinned to commit SHAs, whose trailing
# version comment Dependabot rewrites along with the SHA.
#
# Every JavaScript project gets security updates only: open-pull-requests-limit 0 turns off version
# updates, which security updates are not subject to. Each project has its own entry and group, so a
# project's fixes arrive as one PR touching only its lockfile and merge without conflicting with
# another project's. dependabot-merge.yml merges each PR once its checks pass.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/collect-allure
      - /.github/actions/load-staged-images
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /kinotic-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies, javascript, frontend]
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /kinotic-js/kinotic-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      kinotic-cli-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /kinotic-js/e2e-tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      e2e-tests-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /kinotic-js/load-generator
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      load-generator-security:
        applies-to: security-updates
        patterns:
          - "*"

  # The Kinotic RPC packages and the rest of the published workspace
  - package-ecosystem: bun
    directory: /kinotic-js/workspace
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      workspace-security:
        applies-to: security-updates
        patterns:
          - "*"
