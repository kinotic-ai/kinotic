spring:
  main:
    allow-bean-definition-overriding: true

kinotic:
  debug: true
  maxNumberOfCoresToUse: 4
  # the e2e exercises core + domain (directory) + the gateway; nothing else is on this module's path to boot
  disableOsApi: true
  disableGithub: true
  apiGateway:
    stompPort: 58513
  domain:
    secretStorage:
      # Dummy Base64-encoded key for tests only; lets SecretNameDeriver start in the test context.
      masterKey: a2lub3RpYy10ZXN0LW1hc3Rlci1rZXktZHVtbXktMDA=

logging:
  level:
    org:
      kinotic: INFO
