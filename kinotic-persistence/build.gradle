plugins {
	id 'org.kinotic.java-library-conventions'
	id 'io.freefair.lombok'
}

dependencies {
	implementation project(':kinotic-core')
	implementation project(':kinotic-domain')
	implementation project(':kinotic-api-gateway')
    implementation project(':kinotic-idl')
	implementation project(':kinotic-sql')

	implementation 'co.elastic.clients:elasticsearch-java'

	implementation 'com.fasterxml.jackson.core:jackson-annotations'

	implementation "com.github.ben-manes.caffeine:caffeine"

	implementation "io.vertx:vertx-core"
	implementation "io.vertx:vertx-web-client"
	implementation "io.vertx:vertx-health-check"

	implementation 'org.apache.ignite:ignite-core'
	implementation 'org.apache.ignite:ignite-kubernetes'

	implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'

	implementation 'tools.jackson.core:jackson-core'
	implementation 'tools.jackson.core:jackson-databind'

}

// Configure Javadoc to exclude non-Java files
tasks.named('javadoc') {
	exclude '**/*.interp', '**/*.tokens' // Exclude ANTLR artifacts
}
