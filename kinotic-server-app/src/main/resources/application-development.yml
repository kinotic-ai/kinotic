# YAML Reference http://www.yaml.org/refcard.html
kinotic:
  debug: true
  cors:
    # An application UI's vite dev server on any local port, and the sites a developer publishes
    # under <environment>.kinotic.io (see deployment/terraform/azure/dev)
    allowedOriginPattern: "http:\\/\\/localhost:\\d+|https:\\/\\/[a-z0-9-]+\\.[a-z0-9-]+\\.[a-z0-9-]+\\.kinotic\\.io"
    allowCredentials: true
  domain:
    elastic-connections:
      - scheme: "http"
        host: "localhost"
        port: "9200"
    secretStorage:
      backend: IN_MEMORY
      # The management server's dev key: SecretNameDeriver must derive the same storage names on every
      # server. Dev-only value — production supplies this via Azure Key Vault.
      masterKey: 0qWH2oHEp27LLD7iBHEiABqJFf1q5GRYK6OdMc5Wdv4=
    appApiBaseUrl: http://localhost:58505
  appServer:
    # An application UI's vite dev server on any local port signs its users in to the application
    # whose API host its proxy addresses
    localUiOriginPattern: "http:\\/\\/localhost:\\d+"
  maxNumberOfCoresToUse: 4
  ignite:
    discoveryType: SHAREDFS
  systemSecrets:
    # Seeded on first boot by DevSystemSecretsGenerator, or by whichever server boots first: every
    # server on the machine reads the same file. Production uses Azure Key Vault via the Secrets
    # Store CSI driver — same file layout, different origin.
    generateMissing: true
    jwtSigningKeysPath: ${user.home}/.kinotic/dev-system-secrets/jwt-signing-keys

logging:
  level:
    org:
      kinotic: TRACE
      # Logs every classpath resource it scans at TRACE, which drowns the rest of the log
      kinotic.core.internal.utils.ClassPathScanningMetadataReaderProvider: DEBUG
