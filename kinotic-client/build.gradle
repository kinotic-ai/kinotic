plugins {
    id 'org.kinotic.java-library-conventions'
}

dependencies {
    // api scope: the proxies, service identifiers and connected info of core appear in the client's public API
    api project(':kinotic-core')
    // api scope: the client's operations complete Vert.x futures
    api 'io.vertx:vertx-core'

    implementation 'org.kinotic:vertx-stomp-lite'
    // the client is auto-configured in a Spring Boot application
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework:spring-context'
    // the options carry Bean Validation constraints, checked with the application's Validator
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // api scope: ConnectOptions customizes the JsonMapper the proxies convert with
    api 'tools.jackson.core:jackson-databind'
    // api scope: ConnectOptions takes the OpenTelemetry the proxies trace with
    api 'io.opentelemetry:opentelemetry-api'
    // api scope: a service interface the client proxies returns Mono and Flux
    api 'io.projectreactor:reactor-core'

    // The tests run the client against the gateway, started in-process with a test security service and test services
    testImplementation project(':kinotic-api-gateway')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-jackson'
    testImplementation 'io.projectreactor:reactor-test'
}
