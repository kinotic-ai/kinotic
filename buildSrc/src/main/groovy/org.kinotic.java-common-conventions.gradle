plugins {
    // Apply the java Plugin to add support for Java.
    id 'java'
    id 'io.freefair.lombok'
    id 'io.spring.dependency-management'
}

group 'org.kinotic'
version "${kinoticVersion}"
java {
    sourceCompatibility = '25'
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withJavadocJar()
    withSourcesJar()
}


repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()

    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }

    maven {
        name = 'Central Portal Snapshots'
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
    }
}

// Define configuration for AspectJ agent
configurations {
    agent {
        canBeResolved = true
        canBeConsumed = true
    }
    // If you need to make sure jackson 2 does not exist at all.
    // Use full when upgrading because it still can com from transient dependencies
//    all {
//        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
//        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
//        exclude group: 'com.fasterxml.jackson.datatype'
//        exclude group: 'com.fasterxml.jackson.module'
//        exclude group: 'com.fasterxml.jackson.dataformat'
//    }
}

dependencyManagement {
    imports {
        mavenBom "io.opentelemetry:opentelemetry-bom:${otelBomVersion}"
        mavenBom "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${otelInstrumentationBomVersion}"
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
    dependencies {
        dependency "co.elastic.clients:elasticsearch-java:${elasticClientVersion}"
        dependency "co.elastic.clients:elasticsearch-rest5-client:${elasticClientVersion}"

        dependency "com.azure:azure-communication-email:${azureCommunicationEmailVersion}"
        dependency "com.azure:azure-identity:${azureIdentityVersion}"
        dependency "com.azure:azure-security-keyvault-secrets:${azureKeyvaultSecretsVersion}"

        dependency "com.github.ben-manes.caffeine:caffeine:${caffeineVersion}"
        dependency "com.github.dasniko:testcontainers-keycloak:${testcontainersKeycloakVersion}"
        dependency "com.github.jknack:handlebars:${handlebarsVersion}"

        dependency "com.graphql-java:graphql-java:${graphQlJavaVersion}"

        dependency "commons-io:commons-io:${commonsIoVersion}"

        // JWT and OIDC dependencies
        dependency "io.jsonwebtoken:jjwt-api:${jsonwebtokenVersion}"
        dependency "io.jsonwebtoken:jjwt-impl:${jsonwebtokenVersion}"
        dependency "io.jsonwebtoken:jjwt-jackson:${jsonwebtokenVersion}"

        dependency "io.vertx:vertx-auth-common:${vertxVersion}"
        dependency "io.vertx:vertx-auth-jwt:${vertxVersion}"
        dependency "io.vertx:vertx-auth-oauth2:${vertxVersion}"
        dependency "io.vertx:vertx-core:${vertxVersion}"
        dependency "io.vertx:vertx-grpc-server:${vertxVersion}"
        dependency "io.vertx:vertx-grpcio-client:${vertxVersion}"
        dependency "io.vertx:vertx-grpcio-server:${vertxVersion}"
        dependency "io.vertx:vertx-health-check:${vertxVersion}"
        dependency "io.vertx:vertx-ignite:${vertxVersion}"
        dependency "io.vertx:vertx-reactive-streams:${vertxVersion}"
        dependency "io.vertx:vertx-web:${vertxVersion}"
        dependency "io.vertx:vertx-web-client:${vertxVersion}"
        dependency "io.vertx:vertx-web-graphql:${vertxVersion}"

        // Spring no longer uses javax annotations
        dependency "jakarta.annotation:jakarta.annotation-api:${jakartaAnnotationVersion}"
        // must be overridden for the elastic client
        dependency "jakarta.json:jakarta.json-api:${jakartaJsonVersion}"

        dependency "net.openhft:chronicle-map:${chronicleMapVersion}"

        dependency "org.antlr:antlr4:${antlrVersion}"
        dependency "org.antlr:antlr4-runtime:${antlrVersion}"

        dependency "org.apache.commons:commons-compress:${apacheCommonsCompressVersion}"
        dependency "org.apache.commons:commons-lang3:${apacheCommonsLangVersion}"
        dependency "org.apache.commons:commons-text:${apacheCommonsTextVersion}"

        dependency "org.apache.groovy:groovy:${groovyVersion}"

        dependency "org.apache.ignite:ignite-calcite:${igniteVersion}"
        dependency "org.apache.ignite:ignite-core:${igniteVersion}"
        dependency "org.apache.ignite:ignite-indexing:${igniteVersion}"
        dependency "org.apache.ignite:ignite-kubernetes:${igniteVersion}"
        dependency "org.apache.ignite:ignite-slf4j:${igniteVersion}"
        dependency "org.apache.ignite:ignite-spring:${igniteVersion}"

        dependency "org.kinotic:vertx-stomp-lite:${vertxStompLiteVersion}"

        dependency "org.springframework.boot:spring-boot-configuration-processor:${springBootVersion}"
    }
}

dependencies {
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'ch.qos.logback:logback-core'
    implementation 'ch.qos.logback:logback-classic'

    implementation 'com.fasterxml.jackson.core:jackson-annotations'

    implementation 'io.opentelemetry:opentelemetry-api'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations'

    implementation 'jakarta.annotation:jakarta.annotation-api'

    implementation 'org.apache.commons:commons-lang3'
    implementation 'org.apache.commons:commons-text'

    // Add aspectj weaver dependency for use during tests
    agent "org.aspectj:aspectjweaver:$aspectJVersion"

    testImplementation platform("io.qameta.allure:allure-bom:$allureVersion")
    testImplementation "io.qameta.allure:allure-junit5"
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
}

// Shared Allure test support compiled into every module: ModuleSuiteListener (an Allure
// TestLifecycleListener registered via META-INF/services) rewrites each test's suite labels to
// Kinotic Java > <module> > <class>, grouping all Java module tests under one bucket.
sourceSets.test.java.srcDir(rootProject.file('gradle/allure-support/java'))
sourceSets.test.resources.srcDir(rootProject.file('gradle/allure-support/resources'))

test {
    useJUnitPlatform()
    // Keep the Allure report correct under org.gradle.caching.
    // The Allure JUnit listener writes results to allure.results.directory as a side effect of running the tests:
    //  - point every module at build/allure-results (replaces the per-module allure.properties)
    //  - declare it as a task output so a cached/up-to-date test task restores the results FROM-CACHE instead of producing nothing
    //  - delete it before each execution so a re-run doesn't accumulate stale result files.
    systemProperty 'allure.results.directory', 'build/allure-results'
    // Module name consumed by ModuleSuiteListener to set the suite (middle) level of the Allure tree.
    systemProperty 'kinotic.allure.module', project.name
    outputs.dir(layout.buildDirectory.dir('allure-results')).withPropertyName('allureResults')
    doFirst { delete layout.buildDirectory.dir('allure-results') }
    jvmArgs(
        "-javaagent:${configurations.agent.singleFile}",
        "--add-opens=java.base/java.nio=ALL-UNNAMED",
        "--add-opens=java.base/java.util=ALL-UNNAMED",
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.lang.invoke=ALL-UNNAMED",
    )
    // Show full stack traces with messages and cause chains on test failures (the default 'short'
    // format prints only class:line, which hides the real reason).
    testLogging {
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }
}

