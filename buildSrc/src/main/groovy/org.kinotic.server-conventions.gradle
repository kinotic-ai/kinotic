// A deployable Kinotic server: a Spring Boot application whose jar embeds the OpenTelemetry Java
// agent as BOOT-INF/classes/opentelemetry-javaagent.jar, the path the docker-compose -javaagent
// arguments point at, and lists the libraries it runs, the agent among them, in
// META-INF/kinotic/components.txt, which each node stores as its SBOM when it starts (ServerSbomRecorder)
// for the system console's vulnerability check.
plugins {
    id 'org.kinotic.java-application-conventions'
}

configurations {
    otelAgent {
        canBeResolved = true
        canBeConsumed = false
        // The agent is a self-contained shaded jar; only the single artifact is wanted
        transitive = false
    }
}

dependencies {
    // The agent version tracks the instrumentation BOM version
    otelAgent "io.opentelemetry.javaagent:opentelemetry-javaagent:${otelInstrumentationBomVersion}"
}

// Places the resolved agent at a stable, project-relative path under the name the -javaagent
// arguments use. Kept separate from processResources so launching a server from the IDE
// does not drag in a frontend build.
tasks.register('otelAgentJar', Sync) {
    from configurations.otelAgent
    rename { 'opentelemetry-javaagent.jar' }
    into layout.buildDirectory.dir('otel-agent')
}

// One package URL per line for every library on the runtime classpath and for the agent the JVM runs
// with, sorted, so the listing of a build changes only when its libraries do
def serverComponents = tasks.register('serverComponents') {
    def resolved = [configurations.runtimeClasspath, configurations.otelAgent]
    def outputFile = layout.buildDirectory.file('server-components/components.txt')
    // read from the dependency graph rather than the classpath files, so the listing builds no jar of
    // the projects on the classpath, and with them no frontend
    def purls = provider {
        resolved.collectMany { it.incoming.resolutionResult.allComponents.collect { component -> component.id } }
                .findAll { it instanceof ModuleComponentIdentifier }
                // percent-encoded, as a package URL carries its version
                .collect { "pkg:maven/${it.group}/${it.module}@${URLEncoder.encode(it.version, 'UTF-8')}".toString() }
                .toSorted()
    }
    inputs.property('purls', purls)
    outputs.file(outputFile)
    doLast {
        outputFile.get().asFile.text = purls.get().join('\n') + '\n'
    }
}

tasks.named('processResources') {
    from(tasks.named('otelAgentJar'))
    from(serverComponents) {
        into 'META-INF/kinotic'
    }
}
